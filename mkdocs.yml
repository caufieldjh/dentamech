# Colors and light or dark mode: conf/site.yaml, which `just docs-build` and
# `just docs-serve` apply over the palette below.
#
# The documentation site, built with `just docs-build` and published by the
# docs workflow. The schema pages under docs/elements/ are generated by
# LinkML's gen-doc on every build; do not edit them. Edit the other pages in
# docs/ directly.
site_name: "DentaMech"
site_description: "DentaMech records dental restoration materials: composition, setting, clinical use, performance, adverse effects, regulatory status and standards, one record per OHD term, with every claim quoted from its source."
site_url: https://caufieldjh.github.io/dentamech/
repo_url: https://github.com/caufieldjh/dentamech
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.magiclink
  # Material loads Mermaid itself for these blocks; no plugin is needed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - The domain: DOMAIN.md
  - Curation: CURATION.md
  - Regulatory: regulatory.md
  - Design decisions: explanation/design-decisions.md
  - About: about.md
  - Records: records/index.html
  - Corpus: corpus.md
  - Downloads: downloads.md
  - Schema:
      - Classes, slots and enums: elements/index.md
      - Record structure: structure.md
  - Workflows: WORKFLOWS.md

watch:
  - src/dentamech/schema
