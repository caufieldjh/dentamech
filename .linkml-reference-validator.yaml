# linkml-reference-validator settings. Fetched sources are cached under
# references_cache/ and the cache is committed, so a quote stays checkable
# after the source moves.
validation:
  cache_dir: references_cache
  # An unrecognized reference prefix is an error, not a silent pass.
  unknown_prefix_severity: ERROR
  # Never fetch publisher full text: it would rewrite the committed cache.
  # Fetched sources are checked against their abstracts.
  fetch_full_text: false
  # Closed papers: a curator who holds a copy puts its text in local_full_text/
  # (gitignored), named by cache stem, e.g. DOI_10.1016_j.x.2025.11.017.md.
  # Quotes citing that reference are matched against it, and its text is never
  # cached. `just sign-excerpts` writes the quotes that match, and only those,
  # to reference_excerpts/, which is committed so CI can check them without
  # the paper.
  local_full_text_dir: local_full_text
  signed_excerpts_dir: reference_excerpts
  # Accept only excerpts written by `excerpts sign`, which records the SHA-256
  # of the text matched. A hand-typed entry has none and is ignored.
  signed_excerpts_require_verification: true
  # Fair-use caps, counted in non-whitespace characters of quoted text. They
  # bind every source, not only local copies: the validator has no per-source
  # caps. Set with headroom over the corpus on 2026-11-19 (longest quote 364,
  # most from one source 2,601), and low enough that no source is reproduced:
  # 6,000 is under 10% of ISO 20795-1:2013. See design decision 9 and #55.
  max_excerpt_length: 1000
  max_excerpt_part_length: 600
  # Counted across every record checked in one run, and across each signed
  # bundle when it is written, so `just validate-references-all` enforces it
  # for the corpus. A single-record check sees only that record's quotes;
  # tests/test_refsources.py sums the corpus offline, so `just qc` does too.
  max_total_chars_per_reference: 6000
  # Left at 0. The fraction is taken of the fetched text, which is an
  # abstract, quoted at up to half its length, a short CFR section, quoted at
  # more, or a stub for a local copy. Instead, tests/test_refsources.py holds each
  # signed bundle to 10% of the local copy it was signed from, on every PR.
  max_reference_fraction: 0.0
  # The committed cache is reviewed; never re-fetch an entry to migrate it.
  trust_cached_entries: true
  # Keep all-caps abbreviations and anything with a percent sign as source text.
  literal_bracket_patterns:
    - "^[A-Z]{2,}$"
    - "%"
  # CFR: is checked: src/dentamech/refsources.py fetches the section from the
  # eCFR renderer API. ISO.<number>: standards are checked against a local
  # copy and signed, like closed papers; nothing is fetched (ISOSource in
  # refsources.py). FDA database pages are still checked by people, not here:
  # url: (pending linkml/linkml-reference-validator#179) and FDA_PRODUCT_CODE.
  # See docs/regulatory.md.
  skip_prefixes:
    - url
    - URL
    - FDA_PRODUCT_CODE
