  summary: Added 3D-printed resin-based composite evidence from a closed umbrella review, quoted from
    a local copy and signed
  details: 'Read five Journal of Dentistry 2026 papers held in local_full_text/. One fed this record:
    DOI:10.1016/j.jdent.2026.106626, an umbrella review of 14 systematic reviews on 3D-printed resin-based
    composites. From it: one clinical use (provisional and selected indirect restorations, contraindicated
    for long-term definitive use), six properties (flexural strength, anisotropy with build orientation,
    water sorption and solubility, color stability, post-curing and degree of conversion, dimensional
    accuracy), and two clinical performance entries (87% to 100% success at 6 to 24 months; failure modes).
    Eleven quotes, signed into reference_excerpts/. OHD has no 3D-printed composite term, so the entries
    sit on OHD:0000036 and a notes line says so. The other four papers were logged: one deferred (3D-printed
    denture base resin, no OHD term) and three rejected (bone-loss imaging, coronectomy navigation, intraoral
    scan accuracy). Status left DRAFT; products, mappings and composition of printable resins still unsourced.'
