  details: 'DentalMaterial.category is required and new-record had no way to set it, so every scaffold
    failed validation. Added --category (required) and --purpose and --restorative-class, with choices
    read from MaterialCategoryEnum, MaterialPurposeEnum and RestorativeClassEnum in the schema, and an
    --experimental flag. Keys are written in schema slot order after status. The cross-field rules are
    left to classification_errors through write_validated_record, which already refuses an experimental
    record without purpose, or without restorative_class when RESTORATIVE. Tests run the real validator:
    a minted id, an OHD id with --term-label, the experimental cases and a contradictory class. Updated
    the justfile comment, CLAUDE.md, docs/CURATION.md and the curate-record skill. Fixed here rather than
    upstream: sync-mech will show records.py as a local change against the mechmaker template. A generic
    version that reads the record class''s required slots from the schema belongs in mechmaker and is
    not done.'
