- type: EDIT
  outcome: changed
  summary: Record browser pages ask for style.css with a content hash, so a cached old stylesheet is never
    paired with a new page
  details: 'After PR #40 merged, the published record pages showed the side menu unstyled: flat links
    at the left edge, not sticky, not aligned. The live HTML and CSS were both current (docs deploy run
    42870533803). GitHub Pages serves style.css with cache-control: max-age=600 at a fixed URL, so a browser
    that loaded a record page in the ten minutes before the deploy kept the old stylesheet with the new
    HTML. Rendering the new metal.html with the pre-PR stylesheet in headless Chromium reproduced that
    look. Fix: render.py hashes the rendered CSS (sha256, first 10 hex) and index.html and record.html
    link style.css?v=<hash>. Added tests/test_render.py::test_pages_ask_for_the_stylesheet_they_were_built_with.
    Checked: 13 render tests pass, just qc passes, layout unchanged at 1440, 1100 and 390 px, docs/records
    carries the versioned link. Not verified: that this was the cause on the maintainer''s own browser.'
