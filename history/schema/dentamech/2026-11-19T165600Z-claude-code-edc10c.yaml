  summary: 'Widen scope explicitly to every dental material, in review of #53'
  details: 'The review of #53 found the scope boundary unstated: the minted-id route plus PREVENTIVE and
    AUXILIARY admitted non-restorative materials while the tagline and Out of scope still said restoration
    materials. The maintainer chose to widen explicitly: every dental material, restorative or not, commercial
    or experimental, with or without an OHD term, since the project is in development and OHD is not comprehensive.
    Updated the tagline in six files, the schema description, DOMAIN.md (What a record is, Identity, Sections,
    Out of scope), design decisions 1 and 2, CLAUDE.md and the curate-record skill. Stated that a minted
    record''s parents are the curator''s choice, not OHD is_a links (review note). Dropped ''novel'' as
    a cue for experimental (review note). Recorded that the identity root and seeder still cover OHD:0000000
    only; OHD has no impression, gypsum, sealant, varnish or wax material terms (searched 2026-11-19).
    Not done: a category/restorative_class consistency rule, and an issue for the tagline in .copier-answers.yml.'
