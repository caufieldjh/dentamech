# Build and publish the package with PyPI trusted publishing: TestPyPI on a
# version tag, PyPI on a published release. Needs a `pypi-release`
# environment in this repository, and this repository registered as a
# trusted publisher for the project on PyPI and TestPyPI. No token is stored.
# The version is the tag's (v1.2.3 builds 1.2.3): tag a new version to
# publish one; pyproject.toml holds no version to bump.
name: Publish to PyPI

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags: the version is read from the tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/p/dentamech
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: TestPyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@v1.14.3

