title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
source_char_count: 69252
excerpts:
- text: Despite stable chemical structure and bulk properties, gastric acid exposure combined with routine cleaning impaired surface integrity, color stability, and resistance to microbial colonization of denture base resins.
