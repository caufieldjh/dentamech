reference_id: ISO.20795:1_2013_2
title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
source_char_count: 65982
excerpts:
- text: The upper limit (maximum) for residual methyl methacrylate is 2,2 % mass fraction for denture base polymers of Type 1, Type 3, Type 4, and Type 5. ... The upper limit (maximum) for residual methyl methacrylate is 4,5 % mass fraction for denture base polymers of Type 2.
