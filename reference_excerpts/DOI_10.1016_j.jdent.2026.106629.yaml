reference_id: DOI:10.1016/j.jdent.2026.106629
title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
source_char_count: 79146
excerpts:
- text: A universal adhesive (Single Bond Universal; 3 M ESPE, Neuss, Germany) was applied with a micro-brush using a rubbing motion for
  verification:
