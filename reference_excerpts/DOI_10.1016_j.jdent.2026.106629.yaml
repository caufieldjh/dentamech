    validator_version: 0.8.0
    verified_at: '2026-11-20'
- text: Clinically, a split-mouth randomized controlled trial was performed on 36 NCCLs, equally allocated into four groups, restored with composite resin and assessed at 6, 12, and 24 months using FDI esthetic, functional, and biological criteria
  verification:
    method: local_full_text
    source_sha256: 55601a80c31bd2e81d0602a3a367d170e15eb24d2f6f900c6f617d1dc233ea27
    validator_version: 0.8.0
    verified_at: '2026-11-20'
- text: Composite restorations were performed after a 3-minute waiting period using a self-etch protocol with Single Bond Universal (3 M ESPE)
  verification:
    method: local_full_text
    source_sha256: 55601a80c31bd2e81d0602a3a367d170e15eb24d2f6f900c6f617d1dc233ea27
    validator_version: 0.8.0
    verified_at: '2026-11-20'
- text: Failure mode analysis revealed that mixed failures were the most prevalent pattern in all groups
  verification:
    method: local_full_text
    source_sha256: 55601a80c31bd2e81d0602a3a367d170e15eb24d2f6f900c6f617d1dc233ea27
    validator_version: 0.8.0
    verified_at: '2026-11-20'
- text: Fracture and retention outcomes were excellent across all groups
  verification:
    method: local_full_text
    source_sha256: 55601a80c31bd2e81d0602a3a367d170e15eb24d2f6f900c6f617d1dc233ea27
    validator_version: 0.8.0
    verified_at: '2026-11-20'
- text: Overall, all restorations performed well functionally, and no statistically significant differences were detected between the laser-treated groups and the control group.
  verification:
    method: local_full_text
    source_sha256: 55601a80c31bd2e81d0602a3a367d170e15eb24d2f6f900c6f617d1dc233ea27
    validator_version: 0.8.0
    verified_at: '2026-11-20'
- text: Pure adhesive failures were rare, observed in only one specimen each in Groups I, II, and III
  verification:
