discussions:
- discussion_id: magnesium-oxide-zinc-phosphate-cement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - composition
  prompt: OHD's definition says the powder contains magnesium oxide as well as zinc oxide. No abstract read this session states it, so magnesium oxide is not in composition, and no proportions are recorded for any component.
  rationale: A textbook, a manufacturer's safety data sheet, or ISO 9917-1 from a local copy would supply the powder and liquid composition.
- discussion_id: property-values-zinc-phosphate-cement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - properties
  prompt: Measured values for diametral tensile strength, elastic modulus, film thickness and solubility of zinc phosphate cement alone were not found in the abstracts read. The strength values on Acid-base cement (PMID:11641841) mix zinc phosphate with glass ionomers and are not repeated here.
  rationale: Full texts would give per-material numbers.
- discussion_id: dimensional-change-zinc-phosphate-cement
  kind: OPEN_QUESTION
  status: OPEN
  prompt: Does set zinc phosphate cement shrink or expand in clinical use? A 2009 hypothesis paper argues that it expands, against earlier studies reporting shrinkage. No experimental source was read either way, so no dimensional change property is recorded.
  rationale: A hypothesis paper is not evidence of the property; it marks the question.
notes: 'Products. Harvard Cement (Richter & Hoffmann) and Adhesor appear in the sources as the zinc phosphate cements tested, but no 510(k) was looked up for them, so no products are listed.

  Synonyms. None added: no source read gives an alternative name.

  Setting. setting_mechanisms records ACID_BASE_REACTION as the class does. One study argues the set is an interaction of Al3+ and H2PO4- rather than a simple neutralisation (PMID:6948048); the aluminium component records it.

  Parent evidence. The FDA guidance quotes are substrings of the quotes checked on Acid-base cement; url: references are checked by people, not machines.'
