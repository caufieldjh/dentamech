id: OHD:0000036
name: Resin-based composite
description: A dental restoration material that is primarily composed of highly cross-linked organic polymeric matrix reinforced by filler particles and/or short fibers bound to the matrix by coupling agents and set by light and or chemically activated polymerization reaction.
record_term:
  id: OHD:0000036
  label: resin-based composite dental restoration material
category: RESIN_COMPOSITE
synonyms:
  - composite resin
  - dental composite
  - tooth-colored filling
  - white filling
setting_mechanisms:
  - LIGHT_CURED
  - SELF_CURED
  - DUAL_CURED
composition:
  - name: Bis-GMA
    role: MATRIX
    chemical:
      preferred_term: bisphenol A glycidyl methacrylate (Bis-GMA)
      description: A dimethacrylate monomer; CHEBI has no exact term, so the chemical is left unbound.
    description: Archetypal base monomer of the polymer matrix.
    evidence:
      - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3690
        reference_title: 21 CFR 872.3690 Tooth shade resin material
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: composed of materials such as bisphenol-A glycidyl methacrylate (Bis-GMA)
        explanation: The FDA identification names Bis-GMA as the archetypal matrix monomer.
  - name: Diluent dimethacrylate monomers (e.g. TEGDMA, UDMA)
    role: MATRIX
    chemical:
      preferred_term: methacrylate monomers
      term:
        id: CHEBI:25218
        label: methacrylate
    description: Lower-viscosity monomers blended with Bis-GMA to control handling.
  - name: Inorganic filler (silica, glass, zirconia-silica)
    role: FILLER
    chemical:
      preferred_term: silica
      term:
        id: CHEBI:30563
        label: silicon dioxide
    proportion: typically 60-80 wt% depending on type
  - name: Silane coupling agent
    role: COUPLING_AGENT
    description: Bonds filler particles to the polymer matrix.
  - name: Photoinitiator system (e.g. camphorquinone with amine co-initiator)
    role: INITIATOR
clinical_uses:
  - name: Direct anterior and posterior restorations
    use_context: DIRECT_RESTORATION
    procedure:
      preferred_term: resin filling
      term:
        id: OHD:0000042
        label: resin filling restoration procedure
    anatomical_site:
      preferred_term: tooth
      term:
        id: UBERON:0001091
        label: calcareous tooth
    indications:
      - Restoration of carious lesions or structural defects in teeth
    contraindications:
      - Inability to achieve adequate moisture control during placement
    evidence:
      - reference: PMID:21093034
        reference_title: Resin composite--state of the art.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: the commercial materials that comprise the current armamentarium are of high quality and when used appropriately, have proven to deliver excellent clinical outcomes of adequate longevity
        explanation: Summarizes the clinical standing of current composites.
  - name: Indirect inlays, onlays, and veneers
    use_context: INDIRECT_RESTORATION
    procedure:
      preferred_term: resin inlay
      term:
        id: OHD:0000096
        label: resin inlay restoration procedure
  - name: 3D-printed provisional and selected indirect restorations
    description: Resin-based composites printed by photopolymerization (SLA, DLP, LCD) are used for provisional restorations and for selected indirect restorations such as inlays, onlays, overlays, crowns and veneers. Inferior mechanical and optical stability relative to CAD/CAM-milled materials limits them for long-term definitive restorations.
    use_context: INDIRECT_RESTORATION
    anatomical_site:
      preferred_term: tooth
      term:
        id: UBERON:0001091
        label: calcareous tooth
    indications:
      - Provisional restorations
      - Selected indirect restorations (inlays, onlays, overlays, crowns, veneers)
    contraindications:
      - Long-term definitive restorations, for which evidence of durability is lacking
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 3D-printed resins are viable options for provisional and selected indirect restorations, showing acceptable short-term performance. However, their long-term durability remains uncertain, and CAD/CAM-milled materials continue to offer superior mechanical and optical stability.
        explanation: The review's conclusion on indications and the long-term limit.
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: photopolymerization-based systems such as stereolithography (SLA), digital light processing (DLP), and liquid-crystal display (LCD) have become predominant for polymer applications, enabling the fabrication of provisional and definitive restorations
        explanation: Names the printing technologies and the provisional and definitive restorations they make.
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Short-term clinical evidence (6-24 months) demonstrated encouraging performance for inlays, onlays, overlays, crowns, and veneers, but remains insufficient to support conclusions about true long-term behavior.
        explanation: Lists the indirect restorations with clinical evidence, crowns among them.
properties:
  - name: Polymerization shrinkage and shrinkage stress
    property_type: POLYMERIZATION_SHRINKAGE
    description: The main materials-science problem of the class; recent development has focused on reducing it.
    evidence:
      - reference: PMID:21093034
        reference_title: Resin composite--state of the art.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: The more recent research and development efforts have addressed the issue of polymerization shrinkage and its accompanying stress, which may have a deleterious effect on the composite/tooth interfacial bond.
        explanation: Names shrinkage stress as the issue and its consequence at the bond.
  - name: Flexural strength and elastic modulus of 3D-printed composites
    property_type: FLEXURAL_STRENGTH
    value: lower than CAD/CAM-milled materials
    conditions: 3D-printed (vat photopolymerization) resin-based composites compared with CAD/CAM-milled materials, across systematic reviews
    description: Attributed to lower filler content, a larger organic matrix fraction and a lower initial degree of conversion in printed composites.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Across reviews, 3D-printed resins generally exhibited lower flexural strength, elastic modulus, fatigue resistance, and color stability, as well as higher sorption/solubility, than milled CAD/CAM materials.
        explanation: Pooled direction of the comparison with milled materials.
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: mechanical differences were often attributed to the lower filler content, higher organic matrix proportion, and reduced initial degree of conversion typically observed in printed composites
        explanation: The reviews' explanation for the strength gap.
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: The mechanical disadvantage of printed materials was frequently attributed, within the included reviews, to formulation-related constraints inherent to vat-photopolymerization systems, including reduced filler fraction, higher organic matrix content, and the layer-by-layer polymerization process
        explanation: Ties the strength gap to vat-photopolymerization.
  - name: Anisotropy with build orientation, 3D-printed composites
    property_type: FLEXURAL_STRENGTH
    value: reduced when loaded perpendicular to the build layers
    conditions: 3D-printed resin-based composites; effect of load direction relative to the printed layers
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'Intrinsic anisotropy remained an ubiquitous finding: load application perpendicular to the build layers markedly reduced strength and fatigue resistance'
        explanation: Strength depends on load direction relative to the printed layers.
  - name: Water sorption and solubility of 3D-printed composites
    property_type: WATER_SORPTION
    value: higher than CAD/CAM-milled materials, often two to three times
    conditions: 3D-printed resin-based composites compared with CAD/CAM-milled materials
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Reviews assessing sorption and solubility consistently report higher values for 3D-printed resins compared with CAD/CAM materials, often two to three times greater
        explanation: Gives the size of the sorption and solubility difference.
  - name: Color stability of 3D-printed composites
    property_type: COLOR_STABILITY
    value: lower than CAD/CAM-milled materials
    conditions: 3D-printed resin-based composites compared with CAD/CAM-milled materials, after aging or exposure to staining solutions
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: there is clear agreement that CAD/ CAM materials demonstrate superior color stability, lower water sorption, and better preservation of translucency and gloss over time
        explanation: Milled materials keep color better than printed ones.
  - name: Effect of post-curing on 3D-printed composites
    property_type: DEGREE_OF_CONVERSION
    conditions: 3D-printed resin-based composites; post-curing time and irradiance
    description: Longer post-curing and higher irradiance raise degree of conversion and surface hardness; inadequate post-curing lowers strength and raises monomer leaching.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Inadequate post-curing is associated with lower flexural strength, hardness, and elastic modulus, as well as increased cytotoxicity due to monomer leaching, whereas extended curing time and higher irradiance improve degree of conversion and surface hardness
        explanation: Post-curing drives conversion, hardness and monomer leaching.
  - name: Dimensional accuracy and marginal fit of 3D-printed restorations
    property_type: OTHER
    value: typically within clinically acceptable limits
    conditions: 3D-printed restorations; depends on washing, curing protocol and printing orientation
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Dimensional accuracy and marginal/internal fit were typically within clinically acceptable limits but showed strong dependence on washing procedures, curing protocols, and printing orientation.
        explanation: Fit is acceptable but sensitive to post-processing and orientation.
clinical_performance:
  - name: Main reasons for failure, posterior restorations
    measure_type: COMPLICATION_RATE
    value: caries and fracture
    follow_up_years: 5
    population: Direct posterior resin composite restorations in 12 longitudinal studies with at least 5 years of follow-up (2,816 restorations)
    description: Failure risk was higher in high-caries-risk individuals and with more restored surfaces.
    evidence:
      - reference: PMID:25048250
        reference_title: 'Longevity of posterior composite restorations: a systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Main reasons for failure were caries and fracture. The regression analyses showed a significantly higher risk of failure for restorations in high-caries-risk individuals and those with a higher number of restored surfaces.
        explanation: Pooled individual-participant analysis of failure reasons and risk factors.
  - name: Failure and secondary caries relative to amalgam, posterior permanent teeth
    measure_type: SURVIVAL_RATE
    value: RR 1.89 (95% CI 1.52 to 2.35) for failure; RR 2.14 (95% CI 1.67 to 2.74) for secondary caries
    follow_up_years: 3
    population: Randomized trials in permanent posterior teeth with at least three years of follow-up
    comparator: Amalgam
    evidence:
      - reference: PMID:24683067
        reference_title: Direct composite resin fillings versus amalgam fillings for permanent or adult posterior teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: increased risk of secondary caries (RR 2.14, 95% CI 1.67 to 2.74, P value < 0.001 (low-quality evidence)) but no evidence of an increased risk of restoration fracture (RR 0.87, 95% CI 0.46 to 1.64, P value = 0.66 (moderate-quality evidence))
        explanation: Cochrane estimates for secondary caries and fracture versus amalgam.
  - name: Short-term success of 3D-printed indirect restorations
    measure_type: SUCCESS_RATE
    value: 87% to 100%
    population: Clinical studies of 3D-printed inlays, onlays, overlays, laminate veneers and occlusal restorations with 6 to 24 months of follow-up, from two systematic reviews
    description: Too few and too short studies, with no randomized trials, to judge long-term survival.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Two reviews identified clinical studies with follow-up periods ranging from 6 to 24 months, reporting success rates between 87% and 100% for 3D-printed inlays, onlays, overlays, laminate veneers, and occlusal restorations
        explanation: Range of short-term success rates across the clinical studies.
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: the absence of randomized clinical trials, the small number of available studies, and the heterogeneity of materials and protocols preclude robust conclusions regarding the long-term performance of definitive 3D-printed restorations
        explanation: Why the success rates do not establish long-term survival.
  - name: Failure modes of 3D-printed indirect restorations
    measure_type: COMPLICATION_RATE
    value: fracture, occlusal wear, marginal discrepancy and color change
    population: Clinical studies of 3D-printed indirect restorations with 6 to 24 months of follow-up
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106626
        reference_title: How durable are 3D-printed dental resin-based composites? An umbrella review
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Documented failures were primarily related to material fractures, excessive occlusal wear, marginal discrepancies, and perceptible color changes.
        explanation: The failure modes reported.
adverse_effects:
  - name: Secondary caries at the margin
    effect_category: SECONDARY_CARIES
    effect_term:
      preferred_term: caries
      term:
        id: HP:0000670
        label: Carious teeth
    description: The leading failure reason in long-term posterior studies, and higher than amalgam in trials.
    evidence:
      - reference: PMID:25048250
        reference_title: 'Longevity of posterior composite restorations: a systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Main reasons for failure were caries and fracture.
        explanation: Caries is named first among the failure reasons.
