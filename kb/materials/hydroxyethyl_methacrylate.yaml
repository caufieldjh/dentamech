    notes: Applies to HEMA as the resin component of resin-modified glass ionomer cements and resin cements. The identification quoted is paragraph (b)(1), dental cement other than zinc oxide-eugenol; paragraph (b)(2) gives the class. Product code EMA "cement, dental" is class 2. The zinc oxide-eugenol paragraph (a) does not apply to HEMA.
    evidence:
