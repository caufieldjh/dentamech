    see_also:
      - https://pubmed.ncbi.nlm.nih.gov/34269543/
  - name: Gluma Desensitizer
    description: Dentin desensitizer of 5% glutaraldehyde and 35% HEMA. No 510(k) record was looked up for this product.
    see_also:
      - https://pubmed.ncbi.nlm.nih.gov/34013195/
  - name: Vitremer
    description: Resin-modified glass ionomer restorative; showed the highest HEMA release of three RMGICs tested.
    see_also:
      - https://pubmed.ncbi.nlm.nih.gov/19826597/
notes: |-
  HEMA is a component monomer. Values for flexural strength, hardness, wear, shrinkage, radiopacity, and the like belong to the host products and are not reported here. Working and setting times likewise belong to host products. EU MDR, Health Canada, and TGA standing are not recorded.
  Standards. This slot records standards this material is tested or specified against, scoped to the monomer and not to a product code. ISO 29022, ISO 7405 and ISO/TS 16506 are among the consensus standards FDA recognises for product code KLE, and each url points at that standard's FDA recognition record. ISO 29022's title is given in its ISO form; the FDA record renders it "Adhesive - Notched-edge sheer bond strength test". ISO 9917-2 covers the resin-modified cements that carry HEMA as their resin component. ISO 4049 is listed because the HEMA-release study of resin-modified glass ionomers (PMID:19826597) ran its water absorption tests to it.
