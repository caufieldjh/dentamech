        snippet: Amalgam tattoos are common, oral pigmented lesions that clinically present as isolated, blue, grey, or black macules on the gingivae, the buccal and alveolar mucosae, the palate, and/or the tongue. They are due to deposition of a mixture of silver, tin, mercury, copper, and zinc
        explanation: 'Case report, background: what the lesion is. OTHER: background, not the patient''s findings.'
