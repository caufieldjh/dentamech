        evidence_source: IN_VITRO
        snippet: Amalgam mercury release during MRI is unlikely to be clinically meaningful and highly likely to remain below safe levels.
        explanation: The authors' judgment of the amount.
      - reference: PMID:36228805
        reference_title: The effect of magnetic resonance imaging on mercury release from dental amalgam at 3T and 7T.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: 'Mercury concentration was increased in the 7T groups (high/ low: 15.43/ 11.33 ng mL-1) and 3T high group (3.59) compared to control (2.44).'
        explanation: Which groups rose.
  - name: Occupational mercury exposure
    effect_category: OCCUPATIONAL
    description: Most studies in low- and middle-income countries found higher mercury in dental workers than in controls, and clinic air may exceed recommended thresholds; the evidence on health effects is inconclusive. A 2020 study found dental exposures below the occupational limit.
    evidence:
      - reference: PMID:42160808
        reference_title: 'Biomonitoring of Occupational Exposure to Mercury Among Dental Health Workers in LMICs: A Systematic Review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Most studies reported elevated mercury levels in dental workers compared to control groups.
        explanation: Exposure.
      - reference: PMID:42160808
        reference_title: 'Biomonitoring of Occupational Exposure to Mercury Among Dental Health Workers in LMICs: A Systematic Review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: current evidence regarding potential health effects associated with occupational exposure to mercury is inconclusive due to methodological limitations
        explanation: Health effects.
      - reference: PMID:42160808
        reference_title: 'Biomonitoring of Occupational Exposure to Mercury Among Dental Health Workers in LMICs: A Systematic Review.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Mercury exposure remains a significant occupational hazard for dental health workers, especially in low- and middle-income countries (LMICs), due to the continued use of dental amalgam.
        explanation: 'Background: the setting.'
      - reference: PMID:42160808
        reference_title: 'Biomonitoring of Occupational Exposure to Mercury Among Dental Health Workers in LMICs: A Systematic Review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: mercury vapor concentrations in dental clinics may exceed recommended safety thresholds
        explanation: Clinic air.
      - reference: PMID:32228815
        reference_title: 'Exposure to mercury from dental amalgam: actual contribution for risk assessment.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Current dental exposures based on the most recent findings do not exceed acceptable risk levels and are below the biological limit of mercury in urine valid for occupationally exposed persons
        explanation: A 2020 study of 40 dental personnel and 10 controls, for contrast.
  - name: Environmental release of mercury
    effect_category: ENVIRONMENTAL
    description: Mercury disposal is an environmental concern. The Minamata Convention on Mercury commits its parties to measures that phase down amalgam.
    evidence:
