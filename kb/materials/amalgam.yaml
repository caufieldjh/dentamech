        snippet: Intact amalgam fillings in any individual, including the sensitive groups such as pregnant/nursing mothers and children, should not be removed for the purpose of preventing any disease or health condition, unless considered medically necessary by a health care professional.
        explanation: Advice on existing fillings. Read 2026-11-24.
