discussions:
  - discussion_id: longevity-amalgam
    kind: CONTROVERSY
    status: OPEN
    prompt: 'Does amalgam outlast resin composite in posterior teeth? Favoring amalgam: the 2021 Cochrane update (two older randomized trials in children, low certainty) and a 2015 meta-analysis. No significant difference: a 2025 meta-analysis of 13 studies and permanent-tooth replacement in the New England trial. Favoring composite: a health-record study whose authors doubt such records. Cochrane notes that composites have improved since its trials.'
    rationale: Reviews with similar designs disagree, so no single estimate should stand alone.
  - discussion_id: copper-mercury-vapor-amalgam
    kind: CONTROVERSY
    status: OPEN
    prompt: Does a high copper content lower or raise mercury vapor emission? A laboratory study of eight brands reports that copper counters release; a review reports that high-copper amalgams emit substantially more than low-copper ones.
    rationale: The sign of the effect matters for patient exposure.
  - discussion_id: property-values-amalgam
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: 'No sourced value was found for elastic modulus, fracture toughness, thermal expansion, thermal conductivity, flexural strength or calibrated radiopacity of amalgam: the abstracts read give comparisons without numbers. Strength, creep and dimensional change come from one manufacturer''s 510(k) summary.'
    rationale: Full texts, or ISO 24234 from a local copy, would supply values and methods.
  - discussion_id: minamata-phase-out-amalgam
    kind: CURATION_TODO
    status: OPEN
    prompt: Record the Minamata Convention phase-out. The title of PMID:42714322 refers to a 2034 phase-out; the decision of the parties has not been read (the Convention's site refused automated access on 2026-11-24). Other jurisdictions and the EU device class are also not curated.
  - discussion_id: mri-erratum-amalgam
    kind: CURATION_TODO
    status: OPEN
    prompt: PMID:29944087 (mercury release after 7 T MRI) is followed by a 2019 item with the same title, PMID:30998445, apparently an erratum, which has no abstract and has not been read. Check whether it changes the result quoted here.
notes: FDA discourages the name "silver filling", because it does not say what the material contains; it is kept as a synonym because people use it. OHD and MeSH name zinc as optional; OHD names palladium as optional, and a 2023 study lists a trace of it. Strength, creep and dimensional change come from one brand's 510(k) summary, which cites ISO 24234 without an edition; FDA's listing says the third edition does not apply to pre-capsulated amalgam, the form of that product, which ISO 20749 covers. K140125 also prints strength and composition tables, but their scanned text is not reliable enough to quote. The corrosion value in K223182 (2 µg/cm2) is not recorded, because its test duration is unclear in the table. The EU entry does not cover earlier limits on use in children and in pregnancy under Article 10(2) of Regulation (EU) 2017/852, which was not read.
