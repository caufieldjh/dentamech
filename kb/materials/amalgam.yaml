    special_controls:
      - 'Class II Special Controls Guidance Document: Dental Amalgam, Mercury, and Amalgam Alloy'
    identification: Dental amalgam is a device that consists of a combination of elemental mercury, supplied as a liquid in bulk, sachet, or predosed capsule form, and amalgam alloy composed primarily of silver, tin, and copper, supplied as a powder in bulk, tablet, or predosed capsule form, for the direct filling of carious lesions or structural defects in teeth. This device also includes the individual component devices, mercury and amalgam alloy, when intended to be combined with each other to form dental amalgam.
    approved_uses:
      - name: Direct filling of carious lesions or structural defects in teeth
        use_context: DIRECT_RESTORATION
        procedure:
          preferred_term: amalgam filling
          term:
            id: OHD:0000041
            label: amalgam filling restoration procedure
    source_url: https://www.ecfr.gov/current/title-21/section-872.3070
    notes: EJJ (alloy, amalgam), ELY (mercury) and OIV (dental amalgam) are the only codes under this regulation; all are class 2 with submission type 510(k), checked in the classification database and openFDA on 2026-11-24. The regulation grants no 510(k) exemption.
