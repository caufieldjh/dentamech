adverse_effects:
  - name: Mercury vapor exposure in patients
    effect_category: TOXICITY
    description: Set amalgam releases low levels of mercury vapor, and urinary mercury was higher in children with amalgam than in children with composite. Two randomized trials in children found no significant neuropsychological differences over five and seven years, though one could not rule out very small IQ effects. A renal analysis of one found no difference in average kidney markers or in high tubular markers, but more microalbuminuria with amalgam, which its authors said may be random and should be tested further. The Cochrane review found some differences on certain measures but no consistent or clinically important harms, on very low certainty evidence.
    evidence:
      - reference: url:https://www.fda.gov/medical-devices/dental-devices/dental-amalgam-fillings
        reference_title: Dental Amalgam Fillings (FDA)
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: Releases low levels of mercury in the form of a vapor that can be inhaled and absorbed by the lungs.
        explanation: Exposure route. Read 2026-11-24.
      - reference: PMID:16622139
        reference_title: 'Neuropsychological and renal effects of dental amalgam in children: a randomized clinical trial.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Assignment to the amalgam group was associated with a significantly higher mean urinary mercury level (0.9 vs 0.6 microg/g of creatinine at year 5, P<.001).
        explanation: Exposure, New England trial.
      - reference: PMID:16622139
        reference_title: 'Neuropsychological and renal effects of dental amalgam in children: a randomized clinical trial.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: there were no statistically significant differences in adverse neuropsychological or renal effects observed over the 5-year period in children whose caries were restored using dental amalgam or composite materials
        explanation: Outcome, New England trial.
      - reference: PMID:16622140
        reference_title: 'Neurobehavioral effects of dental amalgam in children: a randomized clinical trial.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: There were no statistically significant differences in measures of memory, attention, visuomotor function, or nerve conduction velocities (average z scores were very similar, near zero) for the amalgam and composite groups over all 7 years of follow-up
        explanation: Outcome, Lisbon trial.
      - reference: PMID:18335109
        reference_title: 'Renal effects of dental amalgam in children: the New England children''s amalgam trial.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: There was, however, a significantly increased prevalence of microalbuminuria (MA) among children in the amalgam group in years 3-5 (adjusted odds ratio 1.8; 95% confidence interval, 1.1-2.9).
        explanation: Further analysis of the New England trial.
      - reference: PMID:18335109
        reference_title: 'Renal effects of dental amalgam in children: the New England children''s amalgam trial.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: The increase in MA may be a random finding, but should be tested further.
        explanation: The authors' caution.
      - reference: PMID:34387873
        reference_title: Direct composite resin fillings versus amalgam fillings for permanent posterior teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Some differences between amalgam and composite resin groups were observed on certain measures of renal, neuropsychological, and psychosocial function, physical development, and postoperative sensitivity; however, no consistent or clinically important harms were found.
        explanation: Cochrane, harms.
      - reference: PMID:34387873
        reference_title: Direct composite resin fillings versus amalgam fillings for permanent posterior teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: The evidence is of very low certainty, with most harms outcomes reported in only one trial.
        explanation: Cochrane, certainty of the harms evidence.
      - reference: PMID:16622139
        reference_title: 'Neuropsychological and renal effects of dental amalgam in children: a randomized clinical trial.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Although it is possible that very small IQ effects cannot be ruled out
        explanation: The New England trial's caveat.
      - reference: PMID:16622139
        reference_title: 'Neuropsychological and renal effects of dental amalgam in children: a randomized clinical trial.'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: children aged 6 to 10 years at baseline with no prior amalgam restorations
        explanation: Population, New England trial.
      - reference: PMID:18335109
        reference_title: "Renal effects of dental amalgam in children: the New England children's amalgam trial."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: There were no significant differences between treatment groups in average levels of renal biomarkers
        explanation: 'Renal analysis: average markers.'
      - reference: PMID:18335109
        reference_title: "Renal effects of dental amalgam in children: the New England children's amalgam trial."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: There were no differences in the occurrence of high levels of renal tubular markers (A1M, gamma-GT, or NAG).
        explanation: 'Renal analysis: tubular markers.'
  - name: Pregnancy outcomes
    effect_category: TOXICITY
    description: Two analyses of the Norwegian Mother and Child Cohort Study differ. One (69 474 pregnancies) found no significant association between amalgam fillings and preterm delivery, low birthweight, malformation or stillbirth. The other (72,038 women) found that the odds of perinatal death (stillbirth plus early neonatal death) rose with the number of filled teeth after adjustment; the increase was not significant for 1 to 12 teeth and was significant for 13 or more, and residual confounding was not excluded. The outcomes overlap only in part.
    evidence:
      - reference: PMID:27146796
        reference_title: Prenatal exposure to dental amalgam and pregnancy outcome.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: revealed no significant associations between the number of teeth with amalgam fillings and early preterm delivery, late preterm delivery, low birthweight, malformation or stillbirth
        explanation: The analysis that found no association.
      - reference: PMID:30532171
