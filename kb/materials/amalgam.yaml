    effect_category: SECONDARY_CARIES
    description: The main reason for failure of both materials in a randomized trial in children; less frequent with amalgam than with composite.
    evidence:
      - reference: PMID:17545266
        reference_title: Survival and reasons for failure of amalgam versus composite posterior restorations placed in a randomized clinical trial.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Secondary caries was the main reason for failure in both materials. Risk of secondary caries was 3.5 times greater in the composite group.
        explanation: Randomized trial in children.
