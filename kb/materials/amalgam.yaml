    description: Laboratory studies differ. One found no significant increase at 1.5, 3 or 7 T; one found an increase at 7 T but not 1.5 T; one found release rising with field strength and radiofrequency power, at 3 T only with high power, and judged the amount unlikely to be clinically meaningful.
