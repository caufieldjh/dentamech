id: OHD:0000001
name: Amalgam
description: 'A metal dental restoration material formed by combining liquid elemental mercury with a powdered alloy primarily of silver, tin and copper: silver and tin dissolve into the mercury and new solid phases precipitate, hardening the mix. It is used for the direct filling of carious lesions or structural defects in teeth, and its use is being phased down worldwide because of its mercury.'
description_evidence:
  - reference: CFR:872.3070
    reference_title: 21 CFR 872.3070 Dental amalgam, mercury, and amalgam alloy
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: Dental amalgam is a device that consists of a combination of elemental mercury, supplied as a liquid in bulk, sachet, or predosed capsule form, and amalgam alloy composed primarily of silver, tin, and copper
    explanation: What amalgam is.
  - reference: PMID:8727105
    reference_title: Setting reactions in dental amalgam. Part 2. The kinetics of amalgamation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The setting reaction begins with dissolution of silver and tin into liquid mercury; most of the product phases precipitate in the liquid mercury.
    explanation: 'Review: how it sets.'
  - reference: CFR:872.3070
    reference_title: 21 CFR 872.3070 Dental amalgam, mercury, and amalgam alloy
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: for the direct filling of carious lesions or structural defects in teeth
    explanation: What it is for.
  - reference: PMID:34387873
    reference_title: Direct composite resin fillings versus amalgam fillings for permanent posterior teeth.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The global phase-down of dental amalgam via the Minamata Convention on Mercury is an important consideration when deciding between amalgam and composite resin dental materials.
    explanation: 'Cochrane, conclusions: the phase-down.'
  - reference: PMID:8727105
    reference_title: Setting reactions in dental amalgam. Part 2. The kinetics of amalgamation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: the reactions that convert the mixture of alloy powder and liquid mercury to hardened amalgam
    explanation: 'Review: hardening.'
