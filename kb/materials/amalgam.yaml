  - name: Working time, condensation
    property_type: WORKING_TIME
    value: 2.5 to 5
    unit: min
    conditions: Worldwork product line (K223182); manufacturer data. One value is printed for nine trade names and both formulations; which was tested is not stated.
    evidence:
      - reference: url:https://www.accessdata.fda.gov/cdrh_docs/pdf22/K223182.pdf
        reference_title: 510(k) Summary K223182, Worldwork S.R.L.
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: 'Working times (minutes) Condense: 2.5 - 5'
        explanation: Time to condense, reported for the subject devices. Read 2026-11-24.
  - name: Corrosion
    property_type: CORROSION_RESISTANCE
    description: All amalgams corrode to some extent in the mouth, and deposited corrosion products partly seal the margins. High-copper amalgams generally perform better clinically, one reason given being that the corrosion-prone gamma-2 phase is nearly eliminated.
    evidence:
      - reference: PMID:1292469
        reference_title: 'Dental amalgam: the materials.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: High-Cu amalgams generally perform better clinically, but all amalgams corrode to some extent in the mouth. Some corrosion is deemed to be a positive factor, because corrosion product deposition reduces leakage at the margins of restorations; that is, the restorations are partly self-sealing.
        explanation: 'Narrative review: corrosion and self-sealing.'
      - reference: PMID:1292469
        reference_title: 'Dental amalgam: the materials.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: One of the reasons cited for the improved clinical performance of high-Cu amalgams over low-Cu amalgams is that the corrosion-prone phase, gamma 2, is nearly eliminated in high-Cu amalgams.
        explanation: 'Narrative review: the role of gamma-2.'
  - name: Corrosion of the phases in a high-copper amalgam
    property_type: CORROSION_RESISTANCE
    conditions: 'Crevice corrosion, in vitro, on three kinds of sample: amalgam from a high-copper single-composition alloy, annealed ingots of Ag3Sn and Cu3Sn, and alloy tablets electroplated with mercury.'
    description: Ag3Sn and Cu3Sn were least affected; gamma-1 (Ag-Hg-Sn) slowly deteriorated; Cu6Sn5 resisted corrosion better than gamma-1.
    evidence:
      - reference: PMID:739017
        reference_title: Corrosion behavior of structural phases in high copper dental amalgam.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The Ag3Sn and Cu3Sn phases were least affected by corrosion. The Ag-Hg-Sn phase (gamma1) slowly deteriorated, but the attack was nonuniform. The Cu6Sn5 phase exhibited good corrosion resistance, better than that of gamma1 phase.
        explanation: Results by phase.
      - reference: PMID:739017
        reference_title: Corrosion behavior of structural phases in high copper dental amalgam.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The effects of crevice corrosion on the major structural phases of a high copper dental amalgam were studied in vitro.
        explanation: The test and the material.
  - name: Fracture toughness by copper content and particle form
    property_type: FRACTURE_TOUGHNESS
    conditions: Sixteen amalgam products, measured at 1 week.
    description: Fell as copper content rose; admixed high-copper products were tougher than single-component ones. The abstract gives no values.
    evidence:
      - reference: PMID:3857312
        reference_title: The fracture toughness (KIC) of amalgam.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The results have shown that the fracture toughness decreases progressively as the copper content increases. The admixed high copper products possess superior fracture toughness to those containing a single component powder.
        explanation: Results.
      - reference: PMID:3857312
        reference_title: The fracture toughness (KIC) of amalgam.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The fracture toughness (KIC) has been measured (at 1 week) for a selection of sixteen amalgam products.
        explanation: Conditions.
  - name: Hardness by copper content
    property_type: HARDNESS
    conditions: Eight commercial brands.
    description: Rose with copper content. The abstract gives no values.
    evidence:
      - reference: PMID:37176331
        reference_title: Determination and Calculations of Mercury Vapor Concentration and Energy Released from Freshly Condensed Dental Amalgams Having Various Copper Percentages within the Alloy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The mechanical hardness of the alloys was found to increase with an increase in copper content in the amalgam.
        explanation: Result.
      - reference: PMID:37176331
        reference_title: Determination and Calculations of Mercury Vapor Concentration and Energy Released from Freshly Condensed Dental Amalgams Having Various Copper Percentages within the Alloy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: dental amalgam received from eight different commercial brands
        explanation: Materials tested.
  - name: Radiopacity relative to other posterior materials
    property_type: RADIOPACITY
    conditions: Compared with ten other posterior restorative materials by mean gray value.
    description: Highest of the materials compared. The abstract gives no aluminum equivalent for amalgam.
    evidence:
      - reference: PMID:37079911
        reference_title: 'Radiopacity of Posterior Restorative Materials: A Comparative In Vitro Study.'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Amalgam had the highest radiopacity.
        explanation: Result, among eleven materials.
      - reference: PMID:37079911
        reference_title: 'Radiopacity of Posterior Restorative Materials: A Comparative In Vitro Study.'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: investigate the radiopacity of 11 commercial posterior restorative materials by establishing their mean gray values (MGVs)
        explanation: Method and number of materials.
  - name: Creep and marginal fracture
    property_type: OTHER
    conditions: Five clinical trials, 2068 restorations of six conventional and ten high-copper alloys.
    description: 'Creep correlated with marginal fracture in conventional low-copper amalgams, but not in high-copper, non-gamma-2 ones. OTHER: PropertyTypeEnum has no value for creep.'
    evidence:
      - reference: PMID:3463718
        reference_title: Creep versus marginal fracture of amalgam restorations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: In five clinical trials, 2068 amalgam restorations were made of six conventional alloys and ten high copper systems.
        explanation: Clinical relation of creep to marginal fracture, by alloy type.
      - reference: PMID:3463718
        reference_title: Creep versus marginal fracture of amalgam restorations.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: The results show a correlation between creep and marginal fracture in the conventional, low copper amalgams. No correlation could be found for the group of high copper, non-gamma-2, amalgams.
        explanation: Clinical relation of creep to marginal fracture, by alloy type.
  - name: Mercury vapor emission by copper content
    property_type: OTHER
    description: 'Sources conflict on whether high copper lowers or raises emission; see the discussion. OTHER: PropertyTypeEnum has no value for vapor emission.'
    evidence:
      - reference: PMID:37176331
        reference_title: Determination and Calculations of Mercury Vapor Concentration and Energy Released from Freshly Condensed Dental Amalgams Having Various Copper Percentages within the Alloy.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: increasing the copper content of the amalgam counters the release of mercury vapor from posterior teeth
        explanation: 'One side of the conflict: copper lowers release.'
      - reference: PMID:28220332
        reference_title: Increased mercury emissions from modern dental amalgams.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: high copper amalgams emit substantially larger amounts of mercury vapor than the low copper amalgams used before the 1970s
        explanation: 'The other side: a review reporting higher emission from high-copper amalgams.'
clinical_uses:
  - name: Direct posterior restoration
    use_context: DIRECT_RESTORATION
    procedure:
      preferred_term: amalgam filling
      term:
        id: OHD:0000041
        label: amalgam filling restoration procedure
    anatomical_site:
      preferred_term: tooth
      term:
        id: UBERON:0001091
        label: calcareous tooth
    indications:
      - Economic direct restoration of posterior teeth
      - High risk of tooth decay, large preparations, or where moisture makes resin bonding difficult
    contraindications:
      - Allergy or sensitivity to mercury or another metal in the amalgam
    evidence:
      - reference: PMID:21217947
        reference_title: 'Dental amalgam: An update.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: For the present, amalgam should remain the material of choice for economic direct restoration of posterior teeth.
        explanation: 'Narrative review (2010): positions amalgam as the economic direct posterior restorative. It predates the phase-down measures under regulatory_status.'
      - reference: url:https://www.fda.gov/medical-devices/dental-devices/dental-amalgam-fillings
        reference_title: Dental Amalgam Fillings (FDA)
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: Useful in patients that have a high risk of tooth decay, for large tooth preparations, and where moisture makes it difficult for other materials such as resins to establish a bond to tooth.
        explanation: Situations in which FDA describes amalgam as useful. Read 2026-11-24.
      - reference: url:https://www.fda.gov/medical-devices/dental-devices/dental-amalgam-fillings
        reference_title: Dental Amalgam Fillings (FDA)
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: If you are allergic or otherwise sensitive to any of the metals in dental amalgam, you should not get amalgam fillings.
        explanation: Allergy as a reason not to place it. Read 2026-11-24.
      - reference: PMID:21217947
        reference_title: 'Dental amalgam: An update.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: When esthetic concerns are paramount, tooth-colored materials, placed meticulously, can provide an acceptable alternative.
        explanation: 'Narrative review: the esthetic limit.'
    description: Direct filling of carious lesions or structural defects, chiefly in posterior teeth. Where esthetics are paramount, tooth-colored materials can be an acceptable alternative.
clinical_performance:
  - name: Failure risk of composite relative to amalgam, posterior permanent teeth
    measure_type: OTHER
    value: RR 1.89 (95% CI 1.52 to 2.35), composite vs amalgam
    population: 921 children in two parallel-group randomized trials (1645 composite and 1365 amalgam restorations); review eligibility was at least three years of follow-up
    comparator: Direct resin composite
    description: Composite had almost double the risk of failure, on low-certainty evidence; all included trials were at high risk of bias. The measure is a risk ratio, not a rate, so measure_type is OTHER.
    evidence:
      - reference: PMID:34387873
        reference_title: Direct composite resin fillings versus amalgam fillings for permanent posterior teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: We found low-certainty evidence that composite resin restorations had almost double the risk of failure compared to amalgam restorations (risk ratio (RR) 1.89, 95% confidence interval (CI) 1.52 to 2.35; P < 0.001)
        explanation: Pooled estimate of the two parallel-group trials (Cochrane, 2021 update).
      - reference: PMID:34387873
        reference_title: Direct composite resin fillings versus amalgam fillings for permanent posterior teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: we combined data from the two parallel-group trials, which involved 1645 composite restorations and 1365 amalgam restorations in 921 children
        explanation: Population.
      - reference: PMID:34387873
        reference_title: Direct composite resin fillings versus amalgam fillings for permanent posterior teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: We judged all of the included studies to be at high risk of bias
        explanation: Risk of bias.
      - reference: PMID:34387873
        reference_title: Direct composite resin fillings versus amalgam fillings for permanent posterior teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: assessed restoration failure or survival at follow-up of at least three years
        explanation: Follow-up required by the review.
  - name: Failure risk of composite and amalgam, wider set of study designs
    measure_type: OTHER
    value: RR 0.96 (95% CI 0.68 to 1.34); no significant difference
    population: 13 clinical trials and observational studies, permanent posterior teeth, at least 12 months of follow-up
    comparator: Direct resin composite
    description: A 2025 meta-analysis that found no significant difference, with varying definitions of failure across its studies. See the longevity discussion.
    evidence:
      - reference: PMID:40578032
        reference_title: 'Failure Risk of Composite Resin and Amalgam Restorations: A Systematic Review and Meta-Analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'The meta-analysis did not find any statistically significant difference in failure risk between amalgam and composite resin restorations (RR: 0.96, 95% confidence intervals: 0.68-1.34).'
        explanation: Pooled estimate.
      - reference: PMID:40578032
        reference_title: 'Failure Risk of Composite Resin and Amalgam Restorations: A Systematic Review and Meta-Analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: clinical trials and observational studies with at least 12 months of follow-up
        explanation: Designs and follow-up.
      - reference: PMID:40578032
        reference_title: 'Failure Risk of Composite Resin and Amalgam Restorations: A Systematic Review and Meta-Analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
