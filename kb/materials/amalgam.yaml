        snippet: 'These high-risk populations include: Pregnant women and their developing fetuses; Women who are planning to become pregnant; Nursing women and their newborns and infants; Children, especially those younger than six years of age; People with pre-existing neurological disease; People with impaired kidney function; People with known heightened sensitivity (allergy) to mercury or other components (silver, copper, tin) of dental amalgam. If you fall into any of the greater risk groups listed above, the FDA strongly encourages the use of non-amalgam restorations (fillings)'
        explanation: The high-risk groups and the recommendation. Page dated 02/18/2021. Read 2026-11-24.
      - reference: url:https://www.fda.gov/medical-devices/dental-devices/dental-amalgam-fillings
