properties:
  - name: Compressive strength, 1 h
    property_type: COMPRESSIVE_STRENGTH
    value: '171'
    unit: MPa
    test_method: ISO 24234, as reported in the 510(k) summary
    conditions: 'Worldwork product line (K223182), admixed spherical and lathe-cut powder; manufacturer data. Acceptance limit as the submission prints it from ISO 24234 (edition not stated): > 100 MPa. One value is printed for nine trade names and both formulations; which was tested is not stated.'
    evidence:
      - reference: url:https://www.accessdata.fda.gov/cdrh_docs/pdf22/K223182.pdf
        reference_title: 510(k) Summary K223182, Worldwork S.R.L.
        supports: SUPPORT
