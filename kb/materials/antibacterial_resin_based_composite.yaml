id: dentamech:96685d61-4656-43b6-ad89-c622451301b9
name: Antibacterial resin-based composite
description: A resin-based composite that carries an antimicrobial agent, so that it inhibits the bacteria of dental plaque biofilm and helps prevent secondary caries, a leading cause of restoration failure. The agent is either bound into the resin and not released (an antimicrobial monomer such as MDPB), released over time (such as chlorhexidine or zinc oxide nanoparticles), or both.
description_evidence:
  - reference: DOI:10.1016/j.jdent.2026.106633
    reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Antibacterial composite resins incorporate antimicrobial agents to inhibit or eliminate bacteria within dental plaque biofilms, thereby contributing to caries prevention.
    explanation: 'Introduction, background citing a review: what the class is and what it is for.'
  - reference: DOI:10.1016/j.jdent.2026.106633
    reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: bacterial adhesion to restorative surfaces and subsequently leading to secondary caries, a primary cause of restoration failure
    explanation: 'Introduction, background: why an antibacterial agent is added.'
status: DRAFT
category: RESIN_COMPOSITE
purpose: RESTORATIVE
restorative_class: COMPOSITE
parents:
  - OHD:0000036
synonyms:
  - antibacterial composite resin
  - antimicrobial resin composite
composition:
  - name: Antimicrobial agent
    role: OTHER
    description: 'The agent that gives the composite its antibacterial activity, of one of three kinds: non-releasing (an antimicrobial monomer polymerized into the matrix, such as the quaternary ammonium compound MDPB), releasing (released gradually, such as chlorhexidine or zinc oxide nanoparticles), or hybrid. OTHER: ComponentRoleEnum has no role for an antimicrobial agent.'
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106633
        reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: 'Antimicrobial agents can be broadly categorized into three types: non-releasing, releasing, and hybrid systems'
        explanation: 'Introduction, background: the three kinds of agent.'
      - reference: DOI:10.1016/j.jdent.2026.106633
        reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Non-releasing agents, such as the quaternary ammonium compound 12-methacryloyloxydodecylpyridinium bromide (MDPB), are widely used as antimicrobial monomers in commercial resin systems
        explanation: 'Introduction, background: a non-releasing agent, MDPB.'
      - reference: DOI:10.1016/j.jdent.2026.106633
        reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Releasing agents, such as zinc oxide (ZnO) nanoparticles and chlorhexidine (CHX), release antimicrobial components gradually, thereby inhibiting bacterial growth
        explanation: 'Introduction, background: releasing agents.'
properties:
  - name: Antibacterial activity
    property_type: ANTIBACTERIAL_ACTIVITY
    description: The defining property of the class. Conventional resin-based composites have little or none, and cannot keep plaque biofilm from forming on them.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106633
        reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Conventional composite resins have been reported to lack antimicrobial activity and are therefore unable to effectively inhibit the formation of dental plaque biofilms
        explanation: 'Introduction, background: the property that distinguishes the class from conventional composites.'
discussions:
  - discussion_id: ohd-term-antibacterial-resin-based-composite
    kind: CURATION_TODO
    status: OPEN
    prompt: 'OHD has no term for an antibacterial or antimicrobial resin-based composite (l~antibacterial, l~antimicrobial, l~bioactive and l~chlorhexidine find nothing, searched 2026-11-20). OHD classifies resin-based composites by filler size and handling. Propose a term at this grain, as a child of resin-based composite (OHD:0000036), defined by an incorporated antimicrobial agent. Chlorhexidine-releasing resin-based composite is curated as its first child.'
  - discussion_id: classification-antibacterial-resin-based-composite
    kind: OPEN_QUESTION
    status: OPEN
    prompt: 'purpose is set to RESTORATIVE (restorative_class COMPOSITE) because the material restores teeth. Its antibacterial agent is there to prevent secondary caries, so it may also be PREVENTIVE. Whether a material can have more than one purpose is question 2 for the project''s dental materials expert on #50.'
  - discussion_id: evidence-antibacterial-resin-based-composite
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: Every statement here is from the introduction of one in vitro study (DOI:10.1016/j.jdent.2026.106633), which cites reviews for them. A review of antibacterial composites, fetched and quoted, should replace or back these quotes, and could give commercial examples, regulatory status and clinical performance, none of which is recorded yet.
notes: 'Whether any antibacterial composite is sold is not recorded: the source says MDPB is used in commercial resin systems but names no product, so experimental is left unset for the class. No regulatory status is recorded; a commercial product would presumably fall under tooth shade resin material (21 CFR 872.3690), but no source for that has been read. Parent is resin-based composite (OHD:0000036), the curator''s choice, not an OHD is_a link.'
