discussions:
- discussion_id: magnesium-oxide-zinc-polycarboxylate-cement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - composition
  prompt: OHD's definition says the powder contains magnesium oxide as well as zinc oxide. No abstract read states it, so magnesium oxide is not in composition, and no proportions are recorded.
  rationale: A textbook, a manufacturer's safety data sheet, or ISO 9917-1 from a local copy would supply the composition.
- discussion_id: adhesion-vs-retention-zinc-polycarboxylate-cement
  kind: OPEN_QUESTION
  status: OPEN
  prompt: The cement adheres to hydroxyapatite (PMID:9645552), yet in the laboratory its push-out strength to dentin was as low as non-adhesive zinc phosphate (PMID:12170851), and it gave the lowest band bond strength of four cements (PMID:40946144). How much its adhesion contributes to clinical retention is not settled by the sources read.
  rationale: Adhesion is the material's defining claim, so the gap between it and measured retention matters.
- discussion_id: crown-luting-outcomes-zinc-polycarboxylate-cement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - clinical_performance
  prompt: No clinical trial reporting survival or retention of crowns or fixed partial dentures on natural teeth luted with zinc polycarboxylate was found. The performance rows are for pulpotomy, retrograde filling and stainless steel crowns.
  rationale: Crown luting is a main use, so its clinical record should be sourced.
notes: 'Products. Poly F Plus, Poly Zinc (Prevest DenPro) and Adhesor Carbofine appear in the sources as the zinc polycarboxylate cements tested, but no 510(k) was looked up for them, so no products are listed.

  Synonyms. "polycarboxylate cement" is the name the sources use (for example PMID:22143701).

  Radiopacity and biocompatibility. PMID:20717709 states in its introduction that the cement is more radiopaque and biocompatible than glass ionomer; no data were read for either, so no property row is recorded.

  Parent evidence. The FDA guidance quotes are substrings of the quotes on Acid-base cement; url: references are checked by people, not machines.'
