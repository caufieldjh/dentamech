  - identifier: ISO 9917-1:2025
    title: Dentistry - Water-based cements - Part 1 - Acid-base cements
    organization: ISO
    url: https://www.iso.org/standard/76037.html
  - identifier: ISO 9917-2:2017
    title: Dentistry - Water-based cements - Part 2 - Resin-modified cements
    organization: ISO
    url: https://www.iso.org/standard/69901.html
notes: |-
  Class-level entry. Composition, properties and uses are stated for the class; subtype specifics belong in the child entries (Glass ionomer cement, Metal modified glass ionomer, Resin-modified glass ionomer, Zinc oxide cement, Zinc phosphate cement, Zinc polycarboxylate cement).
  Fluoride release is not recorded at class level: it belongs to the glass polyalkenoate (glass ionomer) members, and is for the Glass ionomer cement entry.
  Standards. ISO 9917-1 covers the powder/liquid acid-base cements and ISO 9917-2 the resin-modified cements, which sit inside this class: OHD:0001026 resin-modified glass ionomer is a direct is_a child of OHD:0001021. The two parts divide the class by setting chemistry; they do not bound it. FDA recognises ISO 9917-1 third edition 2025-05 (recognition 4-348) and ISO 9917-2 third edition 2017-09 (4-311).
  Not filled. No products are listed: this is an abstract class, so branded products and their 510(k) records belong on the child entries. Working time and flexural strength are not recorded: the FDA guidance marks both "(as applicable, resin-modified cements only)", so they belong on the Resin-modified glass ionomer entry. For the same reason setting_mechanisms records only ACID_BASE_REACTION, the reaction that defines the class.
  Scope of the FDA criteria. Every criterion taken from the guidance sits inside its section III scope (EMA, KLE, DYH), which excludes zinc oxide-eugenol (EMB), a member of this class through Zinc oxide cement (OHD:0001022). No property row sourced from the guidance is therefore stated for every member of the class. Within that scope, compressive strength and acid erosion are limited to the powder/liquid acid-base cements; net setting time and film thickness reach the resin-modified members too.
