notes: |-
  Class-level entry. Composition, properties and uses are stated for the class; subtype specifics belong in the child entries (Glass ionomer cement, Metal modified glass ionomer, Resin-modified glass ionomer, Zinc oxide cement, Zinc phosphate cement, Zinc polycarboxylate cement).
  Standards. ISO 9917-1 is the standard for the class. FDA recognises the third edition, 2025-05, "Dentistry - Water-based cements - Part 1: Acid-base cements", under recognition number 4-348 (recognised 12/22/2025, extent Complete); the second edition, 2007-10-01, was recognised as 4-153 under the older title "Powder/liquid acid-base cements". ISO 9917-2 (third edition 2017-09, FDA recognition 4-311) covers the resin-modified cements, which sit inside this class rather than outside it: OHD:0001026 resin-modified glass ionomer is a direct is_a child of OHD:0001021. All three recognition numbers were re-verified on 2026-10-10 by POST query to the recognized-standards database, which ignores query-string parameters and silently returns an unfiltered listing; 4-348 (recognised 12/22/2025, extent Complete) carries "9917-1 Third Edition 2025-05", 4-153 (01/30/2014, Complete) carries "9917-1 Second edition 2007-10-01", and 4-311 (12/18/2023, Complete) carries "9917-2 Third edition 2017-09". The two ISO catalogue numbers on the standards rows, 76037 and 69901, were confirmed against reseller listings that quote them, the ISO catalogue itself still returning 403. The two parts therefore divide the class by setting chemistry; they do not bound it, and the FDA guidance cited throughout is explicit that "The performance criteria in this guidance are applicable to dental cements as defined in the FDA-recognized consensus standards" of both parts. Editions and titles were verified against the FDA Recognized Consensus Standards database on 2026-09-05, not against the ISO catalogue, which blocks automated retrieval.
  Regulatory. Both branches of 21 CFR 872.3275 were re-verified on 2026-10-10 and agree with docs/regulatory.md. The two CFR snippets and both identification fields were checked character for character against the authoritative eCFR versioner XML, title 21 issue of 2026-10-07, rather than against the law.cornell.edu mirror the reference URLs name, and match it exactly, em dashes included. The product classification database was re-queried the same day. EMA remains class 2 and EMB class 1, and the other two codes under this regulation are still MZW (class 2, full device name "dental cement w/out zinc-oxide eugenol as an ulcer covering for pain relief", truncated in the regulation-wide listing and read from the single-code page) and NEA (class 2). Members of the class that are marketed as permanent tooth-coloured restoratives may instead be cleared under 872.3690 (tooth shade resin material, EBF/OFW); that route is recorded on the individual child entries rather than here, because the acid-base cement class as a whole is not a tooth shade resin material.
  Not filled. No products are listed: this is an abstract class, so branded products and their 510(k) records belong on the child entries. Working time and flexural strength are not recorded: the FDA guidance marks both "(as applicable, resin-modified cements only)" and draws them from ISO 9917-2, so they are criteria for the resin-modified members of the class and not class-wide values. They belong on the Resin-modified glass ionomer entry. For the same reason setting_mechanisms records only ACID_BASE_REACTION, the reaction that defines the class; the polymerisation of the resin-modified members is a property of those members, not of the class.
  Scope of the FDA criteria, the document first. Every criterion taken from the guidance sits inside the guidance's own section III scope, and that scope is narrower than this class. Section III admits only three class II product codes - EMA under 872.3275, KLE under 872.3200 and DYH under 872.3750 - and then names "Zinc oxide-eugenol cements under 21 CFR 872.3275 (product code EMB)" among the things outside the scope of this guidance. Zinc oxide eugenol cement (OHD:0001007) is inside this class, reaching it through Zinc oxide cement (OHD:0001022), so no property row sourced from this guidance can be stated for every member of the class, however the individual test item is scoped. This is also why the second regulatory_status row, the 510(k)-exempt class I EMB branch of 872.3275, carries no performance criteria. The same exclusion is recorded in docs/regulatory.md.
  Scope of the FDA criteria, property by property. Within that document scope the guidance scopes each test item separately, and it does not scope them all the same way, so the recorded properties divide. Compressive strength and acid erosion are marked "(as applicable, powder/liquid acid-base cements only)" and are limited accordingly; their criteria name the three powder/liquid families one by one, and zinc oxide-eugenol is not among them. Net setting time carries no "as applicable" restriction at all, and film thickness is scoped by application ("as applicable, luting cements only") rather than by setting chemistry; both name ISO 9917-1 or ISO 9917-2 as methodology, so both reach the resin-modified members rather than the powder/liquid ones alone. The net setting time row therefore quotes all four rows of Table 2, including the resin-modified one, and records that the lower bound binds the powder/liquid families only, the resin-modified members having an upper bound alone. Table 2's four families are the reach of that row, not the class.
  Provenance. The deep research step of the curate-material skill could not be run: the claude_code provider was unauthenticated in this environment and no other provider key was set, so no research/Acid-base_Cement-deep-research-*.md report accompanies this entry. References were instead found by direct PubMed search, cached with just fetch-reference, and quoted from the cached abstracts.
