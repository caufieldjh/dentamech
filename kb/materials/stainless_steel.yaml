clinical_uses:
  - name: Preformed crowns for primary molars
    use_context: TEMPORARY
    description: Preformed stainless steel crowns (preformed metal crowns, PMCs) cover primary molars that have extensive caries, have had pulp treatment, or are badly broken down. In most cases the tooth is trimmed and the crown fitted under local anaesthetic, and the crown is cemented. The use_context follows the regulation, which frames a preformed crown as interim, as on the Metal record.
    procedure:
      preferred_term: stainless steel crown
      term:
        id: OHD:0000163
        label: stainless steel crown restoration procedure
    anatomical_site:
      preferred_term: primary molar tooth
      term:
        id: UBERON:0013616
        label: primary molar tooth
    indications:
      - Primary molars with extensive caries
      - Primary molars after pulp treatment
      - Badly broken down primary molars
    evidence:
      - reference: CFR:872.3330
        reference_title: 21 CFR 872.3330 Preformed crown
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: It is intended for use as a functional restoration until a permanent crown is constructed.
        explanation: The intended use of the preformed crown device type, which is why use_context is TEMPORARY.
      - reference: CFR:872.3330
        reference_title: 21 CFR 872.3330 Preformed crown
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: The device also may be intended for use as a functional restoration for a badly decayed deciduous (baby) tooth until the adult tooth erupts.
        explanation: The regulation's use for primary teeth.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: They can be made completely of stainless steel (know as 'preformed metal crowns' or PMCs), or to give better aesthetics, may be made of stainless steel with a white veneer cover or made wholly of a white ceramic material.
        explanation: Crowns made wholly of stainless steel are the preformed metal crowns this use describes. Background sentence, so tagged OTHER.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Crowns are recommended for restoring primary molar teeth that have had a pulp treatment, are very decayed or are badly broken down.
        explanation: Source of the three indications. Background sentence, so tagged OTHER.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: In most cases, teeth are trimmed for the crowns to be fitted conventionally using a local anaesthetic.
        explanation: Conventional fitting. Background sentence, so tagged OTHER.
      - reference: PMID:32174622
        reference_title: 'Retentive strength of luting cements for stainless steel crowns: A systematic review.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Stainless steel crowns (SSCs) are unique coronal restorative materials used commonly in the management of primary teeth with extensive caries.
        explanation: The use on primary teeth with extensive caries; the review is about the cements that lute the crowns. Background sentence, so tagged OTHER.
      - reference: PMID:36151937
        reference_title: 'Outcomes of preformed metal crowns placed with the conventional and Hall techniques: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Preformed metal crowns (PMCs) have been used to restore carious primary molars and have a high success and survival rate.
        explanation: The use on carious primary molars. Background sentence, so tagged OTHER.
      - reference: PMID:25905656
        reference_title: 'The use of stainless steel crowns: a systematic literature review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Within the confines of the studies reviewed, primary molar esthetic crowns and SSCs had superior clinical performance as restoratives for posterior primary teeth, and the Hall technique was shown to have validity.
        explanation: Systematic review of stainless steel crowns as restoratives for primary posterior teeth.
      - reference: PMID:17140529
        reference_title: 'Restoration of primary teeth with crowns: a systematic review of the literature.'
        supports: PARTIAL
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Preformed metal crowns were indicated for the restoration of badly broken down primary molars and their success rate was superior to all other restorative materials.
        explanation: PARTIAL because the review's search also took in nickel-chrome crowns.
  - name: Preformed crowns fitted by the Hall Technique
    use_context: TEMPORARY
    description: The same preformed metal crown, pushed over a carious primary molar without local anaesthetic, carious tissue removal or tooth preparation. A separate use because the method changes what is done to the tooth, not because the material differs.
    procedure:
      preferred_term: stainless steel crown, Hall Technique
      term:
        id: OHD:0000163
        label: stainless steel crown restoration procedure
    anatomical_site:
      preferred_term: primary molar tooth
      term:
        id: UBERON:0013616
        label: primary molar tooth
    evidence:
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: However, in the case of the Hall Technique, PMCs are pushed over the tooth with no local anaesthetic, carious tissue removal or tooth preparation.
        explanation: What the Hall Technique is, and that it uses preformed metal crowns. Background sentence, so tagged OTHER.
      - reference: PMID:36151937
        reference_title: 'Outcomes of preformed metal crowns placed with the conventional and Hall techniques: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: There are two methods currently employed for PMC placement - the conventional technique (CT) and Hall technique (HT).
        explanation: The Hall Technique as one of the two ways of placing the crown. Background sentence, so tagged OTHER.
  - name: Prefabricated cusp against a removable denture
    use_context: PROSTHODONTIC
    description: A prefabricated stainless steel cusp that gives a permanent chewing projection, so that the teeth meet a removable denture in a proper bite. Named in the regulation; no clinical literature on it was curated.
    evidence:
      - reference: CFR:872.3350
        reference_title: 21 CFR 872.3350 Gold or stainless steel cusp
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: A gold or stainless steel cusp is a prefabricated device made of austenitic alloys or alloys containing 75 percent or greater gold and metals of the platinum group or stainless steel intended to provide a permanent cusp (a projection on the chewing surface of a tooth) to achieve occlusal harmony (a proper bite) between the teeth and a removable denture.
        explanation: The use as the regulation states it.
regulatory_status:
  - agency: FDA
    status: EXEMPT
    regulation_number: '872.3330'
    regulation_title: Preformed crown
    device_class: CLASS_I
    product_codes:
      - ELZ
    pathways:
      - EXEMPT_510K
    special_controls: []
    identification: A preformed crown is a prefabricated device made of plastic or austenitic alloys or alloys containing 75 percent or greater gold and metals of the platinum group intended to be affixed temporarily to a tooth after removal of, or breakage of, the natural crown (that portion of the tooth that normally protrudes above the gums). It is intended for use as a functional restoration until a permanent crown is constructed. The device also may be intended for use as a functional restoration for a badly decayed deciduous (baby) tooth until the adult tooth erupts.
    approved_uses:
      - name: Functional restoration until a permanent crown is constructed
        use_context: TEMPORARY
      - name: Functional restoration for a badly decayed deciduous tooth until the adult tooth erupts
        use_context: TEMPORARY
    source_url: https://www.ecfr.gov/current/title-21/section-872.3330
    notes: The route by which preformed stainless steel crowns reach the market. This rests on the FDA device listings under ELZ, not on the identification, which names plastic, austenitic alloys and high-gold platinum-group alloys but not stainless steel. The austenitic clause does not establish it on its own, because 872.3350 lists austenitic alloys and stainless steel as separate materials in one sentence. ELZ is the only product code under the regulation.
    evidence:
      - reference: CFR:872.3330
        reference_title: 21 CFR 872.3330 Preformed crown
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: Class I (general controls). The device is exempt from the premarket notification procedures in subpart E of part 807 of this chapter subject to the limitations in § 872.9.
        explanation: Classification paragraph. Class I and 510(k)-exempt subject to 872.9.
      - reference: url:https://api.fda.gov/device/classification.json?search=product_code:%22ELZ%22
        reference_title: FDA Product Classification Database via openFDA, product code ELZ
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: Crown, Preformed
        explanation: 'Device name for ELZ in the product classification database via openFDA: class 1, regulation 872.3330, submission type 4 (510(k) exempt), medical specialty Dental. A search by regulation number returns ELZ only.'
      - reference: url:https://api.fda.gov/device/registrationlisting.json?search=products.product_code:ELZ+AND+proprietary_name:%22stainless+steel+crowns%22&limit=4
        reference_title: FDA Establishment Registration and Device Listing, product code ELZ
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: NuSmile Pre-Contoured Stainless Steel Crowns (SSC)
        explanation: Four establishment listings answer this query (NuSmile, two Hu-Friedy establishments and Cargus), and each carries ELZ as its only product code. That is what places preformed stainless steel crowns under 872.3330, since the identification paragraph never names the material.
  - agency: FDA
    status: EXEMPT
    regulation_number: '872.3350'
    regulation_title: Gold or stainless steel cusp
    device_class: CLASS_I
    product_codes:
      - ELO
    pathways:
      - EXEMPT_510K
    special_controls: []
    identification: A gold or stainless steel cusp is a prefabricated device made of austenitic alloys or alloys containing 75 percent or greater gold and metals of the platinum group or stainless steel intended to provide a permanent cusp (a projection on the chewing surface of a tooth) to achieve occlusal harmony (a proper bite) between the teeth and a removable denture.
    approved_uses:
      - name: Provision of a permanent cusp to achieve occlusal harmony between the teeth and a removable denture
        use_context: PROSTHODONTIC
    source_url: https://www.ecfr.gov/current/title-21/section-872.3350
    notes: Its identification names stainless steel, which 872.3330's does not, and lists austenitic alloys and stainless steel as separate materials. Prosthodontic, not restorative, and a permanent cusp where the preformed crown is temporary. ELO is the only product code under the regulation.
    evidence:
      - reference: CFR:872.3350
        reference_title: 21 CFR 872.3350 Gold or stainless steel cusp
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: Class I (general controls). The device is exempt from the premarket notification procedures in subpart E of part 807 of this chapter subject to the limitations in § 872.9.
        explanation: Classification paragraph. Class I and 510(k)-exempt subject to 872.9.
      - reference: url:https://api.fda.gov/device/classification.json?search=product_code:%22ELO%22
        reference_title: FDA Product Classification Database via openFDA, product code ELO
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: Cusp, Gold And Stainless Steel
        explanation: 'Device name for ELO via openFDA: class 1, regulation 872.3350, submission type 4 (510(k) exempt), medical specialty Dental. A search by regulation number returns ELO only.'
properties:
  - name: Nickel and chromium release in artificial saliva
    property_type: CORROSION_RESISTANCE
    test_method: Immersion of crowns in artificial saliva at 37 °C, ions measured by atomic absorption or ICP spectrometry
    conditions: In vitro, over days to months; the studies vary pH, temperature, trimming and sterilization
    description: Every crown tested releases measurable nickel and chromium. Three of the cited studies judge the amounts below toxic levels or below dietary intake. They disagree on whether pH matters. Several find more release at lower pH, and one finds no pH effect. Autoclave sterilization raised nickel release in one study. No value is recorded because each study reports release per crown, per brand and per day differently.
    evidence:
      - reference: PMID:30804305
        reference_title: An in vitro evaluation of nickel and chromium release from different commercially available stainless steel crowns.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: In all the SSCs tested, there was the release of nickel and chromium, but the total release of both the metals even at a period of 28 days was below the critical level to cause any toxic effects.
        explanation: Crowns from three manufacturers, 28 days in artificial saliva.
      - reference: PMID:40655829
        reference_title: 'To Evaluate and Compare the Release of Nickel, Chromium, and Titanium from Three Different Commercially Available Stainless steel Crowns at Different pH Levels: An In vitro Study.'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: All tested SSCs released measurable amounts of nickel and chromium, with variations based on pH and duration.
        explanation: Three brands at pH 5.5 to 7.5 over six months.
      - reference: PMID:36110694
        reference_title: 'Effects of pH and Time on Nickel Ion Release from Pediatric Stainless-Steel Crowns: An In-Vitro Comparative Study.'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The pH of artificial saliva and nickel ion release is inversely related.
        explanation: More nickel at lower pH, in two brands at pH 4.3 to 6.3.
      - reference: PMID:33107458
        reference_title: An In Vitro evaluation of biodegradability of stainless steel crowns at various salivary pH.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: With decrease in pH, there is an increase in ion release from stainless steel crowns and the mean release of nickel, chromium and iron were very much below the average dietary intake.
        explanation: The same pH effect, for nickel, chromium and iron, and the amounts relative to diet.
      - reference: PMID:29607841
        reference_title: 'Evaluation of nickel releasing from stainless steel crowns regarding to "trimming": An in vitro study.'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Time and pH had no significant effect on released nickel.
        explanation: The dissenting finding on pH named in the description. The same study found less nickel after trimming and more at 47 °C.
      - reference: PMID:25628668
        reference_title: Assessment of nickel release from stainless steel crowns.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The amount of nickel was below the toxic level and did not exceed the dietary intake.
        explanation: 270 crowns over four weeks; nickel was undetectable from day 14.
      - reference: PMID:40263698
        reference_title: Effect of autoclave sterilization on nickel ion release from stainless steel crowns and space maintainer bands.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Nickel release was higher in the sterilized samples than in the non-sterilized samples for both space maintainer bands and stainless steel crowns.
        explanation: Autoclave sterilization raised nickel release.
  - name: Retention with luting cements
    property_type: OTHER
    test_method: In vitro retentive strength of crowns cemented on primary molars
    description: In vitro, self-adhesive resin cements retain stainless steel crowns most strongly, then resin-modified glass ionomer, then conventional glass ionomer. The review still names resin-modified glass ionomer as a preferred luting agent for clinical reasons.
    evidence:
      - reference: PMID:32174622
        reference_title: 'Retentive strength of luting cements for stainless steel crowns: A systematic review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Within the limitations of this study, thein vitro literature seems to suggest that the use of self-adhesive resin cements shows higher retentive strength, followed by resin-modified glass-ionomer cement (RM-GIC) and conventional GIC.
        explanation: Systematic review of seven in vitro studies. The run-together 'thein vitro' is the source's own text.
      - reference: PMID:32174622
        reference_title: 'Retentive strength of luting cements for stainless steel crowns: A systematic review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: However, RM-GIC can be a preferred luting agent due to its clinical advantages over resin cements.
        explanation: The review's clinical preference despite the in vitro ranking.
clinical_performance:
  - name: Twelve-month success of preformed metal crowns fitted by the Hall Technique
    measure_type: SUCCESS_RATE
    value: '98'
    unit: '%'
    follow_up_years: 1.0
    population: Carious primary molars treated by the Hall Technique, pooled across the randomised trials of a systematic review (25 included studies, 15 of them RCTs)
    description: 'Pooled proportion, 95% CI 97-99%. The certainty of evidence was moderate to low, mainly because the visibly different materials prevented blinding.'
    evidence:
      - reference: PMID:39152338
        reference_title: Success rate of Hall Technique for restoring carious primary molars - systematic review and meta-analysis.
        supports: PARTIAL
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'In meta-analyses of RCTs, the pooled proportion success rate was 98% (95% CI: 97-99%) at 12-month follow-up.'
        explanation: The pooled 12-month success. PARTIAL because the abstract does not name the crown material. The Hall Technique is defined by preformed metal crowns (PMID:26718872), but some trials fit other crowns this way.
      - reference: PMID:39152338
        reference_title: Success rate of Hall Technique for restoring carious primary molars - systematic review and meta-analysis.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Searching identified 665 studies, with 25 (15 RCTs and 10 NRSIs) meeting the eligibility criteria.
        explanation: The study counts in the population.
      - reference: PMID:39152338
        reference_title: Success rate of Hall Technique for restoring carious primary molars - systematic review and meta-analysis.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: One of the main reasons for downgrading was related to blinding, which was generally unfeasible due to visibly different restorative materials.
        explanation: Why the certainty of evidence was downgraded.
  - name: Longer-term success of the Hall Technique in non-randomised studies
    measure_type: SUCCESS_RATE
    value: '95'
    unit: '%'
    population: Carious primary molars treated by the Hall Technique, pooled across the non-randomised studies of the same review (10 studies)
    description: Pooled proportion, 95% CI 91-100%, over follow-up of up to 89 months. follow_up_years is left unset because the follow-up varies by study.
    evidence:
      - reference: PMID:39152338
        reference_title: Success rate of Hall Technique for restoring carious primary molars - systematic review and meta-analysis.
        supports: PARTIAL
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'For NRSIs, the pooled proportion success rate was 95% (95% CI: 91-100%) up to 89 months.'
        explanation: Non-randomised studies, follow-up up to 89 months. PARTIAL for the same reason as the 12-month row.
  - name: Success of preformed metal crowns, conventional versus Hall Technique
    measure_type: SUCCESS_RATE
    value: '>85'
    unit: '%'
    follow_up_years: 2.0
    population: Carious primary molars restored with preformed metal crowns in five clinical studies with at least 12 months of follow-up
    comparator: Conventional technique versus Hall Technique
    description: Success and survival were above 85% in both groups at 12 and at 24 months, with no significant difference between the techniques.
    evidence:
      - reference: PMID:36151937
        reference_title: 'Outcomes of preformed metal crowns placed with the conventional and Hall techniques: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: The 12- and 24-month success and survival rates were above 85% for both groups, with no significant differences shown at 12 and 24 months.
        explanation: Both techniques above 85% at 12 and 24 months.
      - reference: PMID:36151937
        reference_title: 'Outcomes of preformed metal crowns placed with the conventional and Hall techniques: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Five articles met the inclusion criteria, and four were included for meta-analysis.
        explanation: The number of studies in the population.
  - name: Long-term major failure, preformed metal crowns versus fillings
    measure_type: OTHER
    value: '0.18'
    unit: risk ratio (crowns versus fillings)
    follow_up_years: 1.0
    population: 346 primary molars in three randomised trials, one with conventionally fitted crowns and two with the Hall Technique
    comparator: Fillings
    description: Risk ratio 0.18 (95% CI 0.06 to 0.56), moderate-quality evidence. Long term here means 12 months or more, so follow_up_years records the lower bound. All the crowns in this comparison were preformed metal crowns.
    evidence:
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: There was moderate quality evidence that the risk of major failure was lower in the crowns group in the long term (risk ratio (RR) 0.18, 95% confidence interval (CI) 0.06 to 0.56; 346 teeth in three studies, one conventional and two using Hall Technique).
        explanation: The risk ratio, its interval and the population.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Four studies compared crowns with fillings; two of them compared conventional PMCs with open sandwich restorations, and two compared PMCs fitted using the Hall Technique with fillings.
        explanation: The crowns in the crowns-versus-fillings comparison were all preformed metal crowns.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: We considered outcomes reported at the dental appointment or within 24 hours of it, and in the short term (less than 12 months) or long term (12 months or more).
        explanation: What long term means here, and so why follow_up_years is a lower bound.
  - name: Clinical failure, zirconia crowns versus stainless steel crowns
    measure_type: OTHER
    value: '0.48'
    unit: risk ratio (zirconia versus stainless steel)
    follow_up_years: 1.0
    population: 497 primary posterior teeth in six randomised trials
    comparator: Preformed zirconia crowns
    description: Risk ratio 0.48 (95% CI 0.15 to 1.52, P = .21). The interval includes 1, so the review found no significant difference in clinical failure and made no recommendation either way. The 63 failures are pooled across both arms. They give no failure rate for stainless steel crowns alone.
    evidence:
      - reference: PMID:35086644
        reference_title: 'Effectiveness of zirconia crowns compared with stainless steel crowns in primary posterior teeth rehabilitation: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Rehabilitation of primary teeth with ZCs may result in fewer clinical failures (risk ratio, 0.48; 95% CI, 0.15 to 1.52; P = .21; I2 = 62%) and probably better gingival health (mean difference, -0.32; 95% CI, -0.42 to -0.23; P < .001; I2 = 0%) than SSCs.
        explanation: The risk ratio for clinical failure, whose interval includes 1.
      - reference: PMID:35086644
        reference_title: 'Effectiveness of zirconia crowns compared with stainless steel crowns in primary posterior teeth rehabilitation: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: From the pooled data of the meta-analysis, the authors observed 63 clinical failure events in 497 primary teeth rehabilitated with ZCs or SSCs.
        explanation: The population, and that the 63 failures pool both arms.
      - reference: PMID:35086644
        reference_title: 'Effectiveness of zirconia crowns compared with stainless steel crowns in primary posterior teeth rehabilitation: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Considering the quality of available literature, no recommendations could be made regarding the effectiveness of ZCs compared with that of SSCs in the rehabilitation of primary posterior teeth.
        explanation: The review makes no recommendation either way.
      - reference: PMID:35086644
        reference_title: 'Effectiveness of zirconia crowns compared with stainless steel crowns in primary posterior teeth rehabilitation: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: A total of 6 studies were included from the initial 641 results.
        explanation: Six included trials.
      - reference: PMID:35086644
        reference_title: 'Effectiveness of zirconia crowns compared with stainless steel crowns in primary posterior teeth rehabilitation: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Primary posterior teeth rehabilitated with ZCs may have less risk of experiencing clinical failure and probably better gingival health after 12 months than SSCs.
        explanation: The 12-month follow-up recorded in follow_up_years.
  - name: Reported failure rates of preformed metal crowns on primary molars
    measure_type: OTHER
    value: 1.9-30.3
    unit: '%'
    population: Fourteen studies of preformed metal crowns on primary molars, none graded A or B1
    comparator: Other restorations for primary molars
    description: The range of failure rates across the studies of an older systematic review. In every study the crowns failed less often than the comparison restorations. Its search terms included nickel-chrome crowns, so not every crown in it is certain to be stainless steel.
    evidence:
      - reference: PMID:17140529
        reference_title: 'Restoration of primary teeth with crowns: a systematic review of the literature.'
        supports: PARTIAL
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Failure rates of PMC varied between 1.9 and 30.3%.
        explanation: The range. PARTIAL because the search included nickel-chrome crowns.
      - reference: PMID:17140529
        reference_title: 'Restoration of primary teeth with crowns: a systematic review of the literature.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: In all studies the failure rate of PMC was lower than comparable restorations and in some studies this was statistically significant.
        explanation: The comparison with other restorations.
      - reference: PMID:17140529
        reference_title: 'Restoration of primary teeth with crowns: a systematic review of the literature.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Using all the search words, 112 papers were found and fourteen were acceptable. Of these none were rated A or B1, seven B2 and seven C.
        explanation: Fourteen studies, none graded A or B1.
adverse_effects:
  - name: Metal allergy
    effect_category: ALLERGIC_OR_HYPERSENSITIVITY
    effect_term:
      preferred_term: allergic reaction to nickel from a stainless steel crown
      term:
        id: MONDO:0006525
        label: allergic contact dermatitis
    frequency: Not estimable. The evidence in children is limited and mostly low quality.
    description: Nickel is the allergen of concern. The clinical evidence for allergic reactions to stainless steel crowns in children is limited. In vitro, one study finds nickel release from crowns below dietary intake but enough to cause allergic reactions, and another says allergy to nickel cannot be ruled out. Bound to the broad allergic contact dermatitis term, as on the Metal record (see notes).
    evidence:
      - reference: PMID:32522913
        reference_title: Biological responses to pediatric stainless steel crowns.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Evidence of allergic reactions to SSCs in children is limited and obtained from mostly low-quality research.
        explanation: The state of the clinical evidence, and why frequency is not estimable.
      - reference: PMID:36110694
        reference_title: 'Effects of pH and Time on Nickel Ion Release from Pediatric Stainless-Steel Crowns: An In-Vitro Comparative Study.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Of these constituents, nickel is known to be a common cause of hypersensitivity reactions.
        explanation: Nickel as the allergen of concern. Background sentence, so tagged OTHER.
      - reference: PMID:36110694
        reference_title: 'Effects of pH and Time on Nickel Ion Release from Pediatric Stainless-Steel Crowns: An In-Vitro Comparative Study.'
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: The maximum average nickel ion release from stainless steel crowns is below the recommended dietary intake but sufficient to cause allergic reactions.
        explanation: An in vitro judgment, not an observed reaction, so PARTIAL.
      - reference: PMID:33107458
        reference_title: An In Vitro evaluation of biodegradability of stainless steel crowns at various salivary pH.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: But the allergic manifestations of ions like nickel can't be ruled out.
        explanation: In vitro; the authors decline to rule allergy out.
  - name: Nickel and chromium release into saliva and tooth tissue
    effect_category: TOXICITY
    frequency: Release occurs from every crown tested in the cited studies. Where they compare the amounts with a threshold, the amounts are below toxic levels or below dietary intake.
    description: After stainless steel crowns are placed, salivary nickel and chromium rise. Teeth that carried a crown have several times more nickel, chromium and iron in the root cementum below the crown than intact teeth. The systematic review on biological responses records concern about ion leaching in children at high caries risk. No study cited here reports harm from it. The TOXICITY category records the concern the sources raise, not an observed toxic effect.
    evidence:
      - reference: PMID:29796983
        reference_title: "Effects of Restoring the Primary Dentition with Stainless-Steel Crowns on Children's Salivary Nickel and Chromium Levels, and the Associations with Saliva pH: a Preliminary Before-After Clinical Trial."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: It was shown for the first time that SSCs might increase salivary nickel and chromium concentrations and reduce saliva acidity.
        explanation: Before-after study of 30 children, two months after crown placement.
      - reference: PMID:29796983
        reference_title: "Effects of Restoring the Primary Dentition with Stainless-Steel Crowns on Children's Salivary Nickel and Chromium Levels, and the Associations with Saliva pH: a Preliminary Before-After Clinical Trial."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Salivary nickel concentrations increased from 4.9010 ± 4.7390 to 5.6320 ± 4.7210 μg/L (P = 0.000, paired t test).
        explanation: The size of the salivary nickel rise.
      - reference: PMID:21274429
        reference_title: Absorption of nickel, chromium, and iron by the root surface of primary molars covered with stainless steel crowns.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Higher amounts of nickel, chromium, and iron (5-6 times) were found in the cementum of molars covered with stainless-steel crowns compared to intact molars.
        explanation: Analysis of 17 primary molars that carried crowns in the mouth for more than two years, against 17 intact molars, after exfoliation or extraction.
      - reference: PMID:32522913
        reference_title: Biological responses to pediatric stainless steel crowns.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: There is some concern about the leaching of metal ions such as Ni from SSCs in children at high risk for caries.
        explanation: The concern the review records.
      - reference: PMID:32522913
        reference_title: Biological responses to pediatric stainless steel crowns.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Some studies showed that the amount of Ni detected was less than the amount ingested in the daily diet.
        explanation: The amounts relative to diet.
      - reference: PMID:30804305
        reference_title: An in vitro evaluation of nickel and chromium release from different commercially available stainless steel crowns.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: In all the SSCs tested, there was the release of nickel and chromium, but the total release of both the metals even at a period of 28 days was below the critical level to cause any toxic effects.
        explanation: Release below the level that causes toxic effects.
  - name: Plaque accumulation and gingival inflammation
    effect_category: PERIODONTAL_RESPONSE
    effect_term:
      preferred_term: gingival inflammation around a stainless steel crown
      term:
        id: HP:0000230
        label: Gingivitis
    description: Compared with preformed zirconia crowns, stainless steel crowns accumulate more plaque and have a higher gingival index. Against fillings, it is uncertain whether crowns raise the risk of gingival bleeding.
    evidence:
      - reference: PMID:36180321
        reference_title: 'Comparison of periodontal health of primary teeth restored with zirconia and stainless steel crowns: A systemic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Although stainless steel crowns were more likely to have plaque deposition and gingival inflammation, zirconia crowns relatively caused the opposite tooth wearing and chipping.
        explanation: Five randomised trials, 160 children.
      - reference: PMID:36180321
        reference_title: 'Comparison of periodontal health of primary teeth restored with zirconia and stainless steel crowns: A systemic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: The quantitative analysis showed a significantly lower gingival index of zirconia crowns in the primary molar group and the primary incisor group.
        explanation: Gingival index higher with stainless steel crowns.
      - reference: PMID:35086644
        reference_title: 'Effectiveness of zirconia crowns compared with stainless steel crowns in primary posterior teeth rehabilitation: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Rehabilitation of primary teeth with ZCs may result in fewer clinical failures (risk ratio, 0.48; 95% CI, 0.15 to 1.52; P = .21; I2 = 62%) and probably better gingival health (mean difference, -0.32; 95% CI, -0.42 to -0.23; P < .001; I2 = 0%) than SSCs.
        explanation: Better gingival health with zirconia crowns than with stainless steel crowns, in a second meta-analysis.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: PARTIAL
        evidence_source: SYSTEMATIC_REVIEW
        snippet: It is uncertain whether there is a clinically important difference in the risk of gingival bleeding when using crowns rather than fillings, either in the short term (RR 1.69, 95% CI 0.61 to 4.66; 226 teeth) or long term (RR 1.74, 95% CI 0.99 to 3.06; 195 teeth, two studies using PMCs with conventional technique at 12 months) (low quality evidence).
        explanation: Against fillings the gingival effect is uncertain, so PARTIAL.
  - name: Metallic appearance
    effect_category: ESTHETIC
    description: The crowns are metal-coloured. Veneered stainless steel crowns and wholly ceramic crowns are made to improve the appearance.
    evidence:
      - reference: PMID:36180321
        reference_title: 'Comparison of periodontal health of primary teeth restored with zirconia and stainless steel crowns: A systemic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: However, due to the unnatural color of stainless steel crowns, it still needs to modify crown types.
        explanation: The colour of the crowns as a reason for other crown types. Background sentence, so tagged OTHER.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: They can be made completely of stainless steel (know as 'preformed metal crowns' or PMCs), or to give better aesthetics, may be made of stainless steel with a white veneer cover or made wholly of a white ceramic material.
        explanation: Veneered and ceramic crowns exist to give better aesthetics. Background sentence, so tagged OTHER.
discussions:
  - discussion_id: composition-stainless-steel
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: 'No fetched source gives the alloy of stainless steel crowns: its grade, the proportions of iron, chromium and nickel, or whether it is austenitic. The only 18/8 statement found (PMID:1350883) is about orthodontic face-bows, brackets and molar bands, not crowns. PMID:7047703 (18-8 stainless steel for cast crowns) has no abstract in PubMed. A manufacturer''s technical sheet or a materials paper that analyses crowns would fill composition[].proportion.'
  - discussion_id: uses-stainless-steel
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: 'Not curated: preformed stainless steel crowns on permanent first molars, for example those affected by molar-incisor hypomineralisation (leads PMID:34115431, PMID:37924021, PMID:37381120), and veneered (pre-veneered) stainless steel crowns (PMID:24960395). Read and quote them before adding uses or performance rows.'
notes: |-
  Scope. The OHD term is a restoration material, so this record covers the restorative and prosthetic uses that 21 CFR 872 subpart D names: preformed crowns (872.3330) and the prefabricated cusp (872.3350). Stainless steel is also used for orthodontic wires, brackets and bands and for space maintainer bands. Those auxiliary uses are not curated here, their regulatory status was not looked up, and OHD has no material term for them (l~orthodontic, wire, bracket, space maint and band found none, 2026-11-21).
  Setting. NONE because the crowns and cusps are prefabricated: the regulations call both a prefabricated device. Trimming a crown to fit is shaping, not setting, and SettingMechanismEnum has no value for it.
  Properties. Retention with luting cements is property_type OTHER rather than BOND_STRENGTH. A retentive strength test measures the force to dislodge a cemented crown, which depends on the crown's fit to the prepared tooth as well as on the cement's bond, so it is not bond strength to a substrate.
  Terms. The allergy row is bound to MONDO:0006525 allergic contact dermatitis, a broad term, as on the Metal record. MONDO:0005481 contact dermatitis due to nickel names the allergen but is not under allergic contact dermatitis in MONDO, and neither term names the oral presentation.
  Left out. Standards: the FDA-recognized standards recorded for Metal (ISO 22674, ISO 10271 and the others) are tied in FDA's database to the cast-alloy and amalgam regulations, not to 872.3330 or 872.3350, and no standard specific to preformed crowns was verified. Products: the crowns are 510(k)-exempt, so there are no submissions to record. Brands under ELZ (NuSmile, Hu-Friedy, Cargus) are cited on the 872.3330 entry as listings. Regulators other than FDA, because none were verified against a primary source.
