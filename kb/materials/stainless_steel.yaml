id: OHD:0000137
name: Stainless steel
description: A metal dental restoration material in which the principal ingredient is stainless steel, a steel containing nickel, chromium or both. In dentistry it is commonly used as preformed crowns for primary molars with extensive caries, fitted either conventionally or by the Hall Technique, and also as a prefabricated cusp that gives a proper bite against a removable denture.
description_evidence:
  - reference: url:https://id.nlm.nih.gov/mesh/M0020409
    reference_title: MeSH concept M0020409 Stainless Steel, scope note
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A steel containing Ni, Cr, or both.
    explanation: MeSH scope note for Stainless Steel; the definition of the alloy used in the description.
  - reference: PMID:32174622
    reference_title: 'Retentive strength of luting cements for stainless steel crowns: A systematic review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Stainless steel crowns (SSCs) are unique coronal restorative materials used commonly in the management of primary teeth with extensive caries.
    explanation: Stainless steel crowns as a restorative for primary teeth with extensive caries. Background sentence, so tagged OTHER.
  - reference: PMID:26718872
    reference_title: Preformed crowns for decayed primary molar teeth.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: However, in the case of the Hall Technique, PMCs are pushed over the tooth with no local anaesthetic, carious tissue removal or tooth preparation.
    explanation: The Hall Technique as the alternative to conventional fitting. Background sentence, so tagged OTHER.
  - reference: CFR:872.3350
    reference_title: 21 CFR 872.3350 Gold or stainless steel cusp
    supports: SUPPORT
    evidence_source: REGULATORY_DOCUMENT
    snippet: A gold or stainless steel cusp is a prefabricated device made of austenitic alloys or alloys containing 75 percent or greater gold and metals of the platinum group or stainless steel intended to provide a permanent cusp (a projection on the chewing surface of a tooth) to achieve occlusal harmony (a proper bite) between the teeth and a removable denture.
    explanation: The prefabricated stainless steel cusp against a removable denture.
