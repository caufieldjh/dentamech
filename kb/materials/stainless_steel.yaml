composition:
  - name: Iron
    role: ALLOYING_ELEMENT
    description: Released from stainless steel crowns along with nickel and chromium in the cited studies, which shows it is present. No fetched source states that iron is the base metal or gives the proportions for crowns.
    chemical:
      preferred_term: iron
      term:
        id: CHEBI:18248
        label: iron atom
    evidence:
      - reference: PMID:21274429
        reference_title: Absorption of nickel, chromium, and iron by the root surface of primary molars covered with stainless steel crowns.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: Stainless-steel crowns release nickel, chromium, and iron in oral environment, and the ions are absorbed by the primary molars roots.
        explanation: Iron released from the crowns shows it is a constituent. PARTIAL because the quote is about release, not composition.
      - reference: PMID:33107458
        reference_title: An In Vitro evaluation of biodegradability of stainless steel crowns at various salivary pH.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: Maximum release of Ni, Cr, Fe ions were observed at pH 4.3 followed by pH 5.5 and least release of ions were observed at pH 6.3 from SS crowns.
        explanation: Iron is among the ions released from the crowns. PARTIAL for the same reason.
  - name: Chromium
    role: ALLOYING_ELEMENT
    description: An alloying element of the steel, present in stainless steel crowns.
    chemical:
      preferred_term: chromium
      term:
        id: CHEBI:28073
        label: chromium atom
    evidence:
      - reference: PMID:29796983
        reference_title: "Effects of Restoring the Primary Dentition with Stainless-Steel Crowns on Children's Salivary Nickel and Chromium Levels, and the Associations with Saliva pH: a Preliminary Before-After Clinical Trial."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Nickel and chromium existing in stainless-steel crowns (SSCs, used in pediatric dentistry) might be cytotoxic and allergenic.
        explanation: States that chromium is present in stainless steel crowns. Background sentence, so tagged OTHER.
      - reference: url:https://id.nlm.nih.gov/mesh/M0020409
        reference_title: MeSH concept M0020409 Stainless Steel, scope note
        supports: PARTIAL
        evidence_source: OTHER
        snippet: A steel containing Ni, Cr, or both.
        explanation: MeSH says Ni, Cr, or both, so it does not by itself establish chromium; PARTIAL.
  - name: Nickel
    role: ALLOYING_ELEMENT
    description: An alloying element of the steel, present in stainless steel crowns. It is the constituent the allergy concern is about.
    chemical:
