  notes: Paragraph (b) of the regulation. Its device is every dental cement other than zinc oxide-eugenol, so by its wording a zinc oxide cement made without eugenol falls here (class II, EMA), not under paragraph (a), the class I, 510(k)-exempt zinc oxide-eugenol device (EMB). No regulation names zinc oxide non-eugenol cement on its own, and no 510(k) was looked up to confirm the route for a marketed product. The same regulation also carries MZW (ulcer covering) and NEA (ear, nose and throat cement); neither is a dental restorative use.
