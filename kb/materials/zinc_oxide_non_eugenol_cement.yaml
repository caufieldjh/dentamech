- identifier: ISO 3107
  title: Dentistry - Zinc oxide/eugenol cements and zinc oxide/non-eugenol cements
  organization: ISO
discussions:
- discussion_id: liquid-composition-zinc-oxide-non-eugenol-cement
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - composition
  prompt: OHD's definition says aliphatic or butyric acid replaces the eugenol. No source read states what replaces it, or in what form the zinc oxide is supplied, so composition lists only zinc oxide and no proportions are recorded.
  rationale: A manufacturer's safety data sheet or instructions for use (for example for TempBond NE or Freegenol), or a textbook, would supply the composition.
- discussion_id: cytotoxicity-zinc-oxide-non-eugenol-cement
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - adverse_effects#Cytotoxicity
  prompt: How cytotoxic is it relative to other cements? To gingival fibroblasts it was the most cytotoxic of four in one study (PMID:38826571), third of four in another (PMID:35096067), and the least cytotoxic of the cements tested in a third (PMID:27927285). A fourth found every cement tested, this one included, below the 70% viability threshold (PMID:40390827). Two of the studies abbreviate the non-eugenol cement as ZOE, which invites misreading.
  rationale: The studies used different cements, cell lines and exposure times, so no single ranking is supported.
- discussion_id: eugenol-free-rationale-zinc-oxide-non-eugenol-cement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: The usual reason to choose a non-eugenol zinc oxide cement is that eugenol is thought to interfere with resin bonding. The bonding studies found compare eugenol-containing with eugenol-free temporary cements without saying that the eugenol-free one is zinc oxide-based (PMID:21241765, PMID:24837710), so the rationale is not recorded as a claim about this material.
  rationale: A source comparing zinc oxide-eugenol with zinc oxide non-eugenol on later resin bonding would settle it.
notes: 'Naming. "Non-eugenol" also describes resin-based temporary cements (for example Temp Bond Clear, Premier Implant Cement). Only sources that name a zinc oxide non-eugenol cement, or a product that the source or another cited source identifies as one, are used here: TempBond NE and Temp-Bond NE are identified in PMID:42419702, PMID:34249248 and PMID:31040551, Freegenol in PMID:29807736. Evidence that relies on another source''s identification is marked PARTIAL.

  Products. TempBond NE, RelyX Temp NE and Freegenol appear in the sources, but no 510(k) was looked up, so no products are listed.

  Antioxidative activity. PMID:25730995 reports lower antioxidative values for non-eugenol pastes, Temp Bond NE among them, than for eugenol-based ones; the abstract does not separate Temp Bond NE from the other non-eugenol groups, so no property row is recorded.

  Regulatory. The 872.3275(b) entry rests on the regulation''s wording, every cement other than zinc oxide-eugenol.

  Setting mechanism. ACID_BASE_REACTION is kept from the seeded record and OHD''s definition (zinc oxide with an aliphatic or butyric acid). No source read describes the set, since none states the liquid''s composition; see the liquid-composition discussion.'
