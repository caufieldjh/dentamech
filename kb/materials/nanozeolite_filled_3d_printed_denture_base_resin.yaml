discussions:
  - discussion_id: ohd-term-nanozeolite-filled-denture-base-resin
    kind: CURATION_TODO
    status: OPEN
    prompt: 'OHD has no term for this material or its parent (l~zeolite and l~denture find no material, searched 2026-11-20). It would follow a denture base polymer term (see that record and #51). Whether an experimental formulation this specific warrants its own term, or should be proposed at a broader grain such as nanofiller-reinforced denture base resin, is for OHD and the project''s expert.'
  - discussion_id: classification-nanozeolite-filled-denture-base-resin
    kind: OPEN_QUESTION
    status: OPEN
    prompt: 'purpose RESTORATIVE and restorative_class POLYMER are tentative, set at the maintainer''s direction on 2026-11-20 so that the experimental record validates. Whether a denture base material is RESTORATIVE is still open with the project''s dental materials expert on #51; the parent record leaves both unset. Change both records together when that is answered.'
  - discussion_id: evidence-threshold-nanozeolite-filled-denture-base-resin
    kind: OPEN_QUESTION
    status: OPEN
    prompt: 'This record rests on one in vitro study of one commercial resin with two nanozeolite loadings. Whether that is enough evidence for an experimental record is question 3 for the project''s expert on #50.'
notes: 'Values are those of DOI:10.1016/j.jdent.2026.106622 only: one printing resin, two loadings. The study reports no flexural strength or other ISO 20795-1 requirement, so conformity to that standard is unknown. Its thermogravimetric results include a 5% weight loss at 32.6 °C for the aged control, which is not quoted. Parent is denture base polymer, the curator''s choice.'
