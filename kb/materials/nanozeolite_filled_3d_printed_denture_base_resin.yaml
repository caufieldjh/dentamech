id: dentamech:9ad5d6b0-4187-42ef-87f0-7f00a6f69d0f
name: Nanozeolite-filled 3D-printed denture base resin
description: An experimental denture base material made by adding nanozeolite, a crystalline aluminosilicate nanoclay, to a methacrylate 3D-printing denture base resin. In the one study curated, 0.25% and 0.5% nanozeolite raised thermal stability and degree of conversion, changed colour less after aging (not a significant difference from the unmodified resin), reduced monomer release, and reduced Streptococcus mutans biofilm compared with the unmodified resin.
description_evidence:
  - reference: DOI:10.1016/j.jdent.2026.106622
    reference_title: In-vitro assessment of thermal stability, color stability, degree of conversion, nanozeolite and monomer release, and antibacterial effect in nanozeolite-filled 3D printed denture base resin
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This study evaluated the effect of incorporating nanozeolite (NZ) into three-dimensionally (3D) printed denture base resins to address limitations in thermal stability, optical properties, degree of conversion (DC), monomer release, and antibacterial activity.
    explanation: 'Abstract, objectives: the material, made by modifying a printing resin in the laboratory.'
  - reference: DOI:10.1016/j.jdent.2026.106622
    reference_title: In-vitro assessment of thermal stability, color stability, degree of conversion, nanozeolite and monomer release, and antibacterial effect in nanozeolite-filled 3D printed denture base resin
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: NZ reinforcement improved the thermal, optical, and biological performance of 3D printed denture base resins
    explanation: Abstract, conclusions.
status: PROPOSED
