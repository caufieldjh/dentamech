id: dentamech:2eb66071-5a0a-400c-aea8-55803cab65c8
name: Chlorhexidine-releasing resin-based composite
description: An experimental antibacterial resin-based composite that releases chlorhexidine. In the one study curated, chlorhexidine was loaded onto bioactive glass 45S5, which went as filler into a Bis-GMA and TEGDMA resin modified with POSS nanomonomer. At 2% chlorhexidine loading the composite kept acceptable mechanical properties, released chlorhexidine in a sustained way, showed no toxicity in cell and animal tests, and inhibited bacteria in vitro.
description_evidence:
  - reference: DOI:10.1016/j.jdent.2026.106633
    reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The aim of this study was to develop a novel antibacterial dental composite resin by loading chlorhexidine (CHX) onto bioactive glass (BG 45S5) and incorporating it into a resin matrix containing cage-type polyhedral oligomeric silsesquioxane (POSS) nanomonomers.
    explanation: 'Abstract, introduction: the material and that it is new, made in the laboratory.'
  - reference: DOI:10.1016/j.jdent.2026.106633
    reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Incorporation of 2% CHX-loaded bioactive glass 45S5 into a POSS-modified composite resin maintained acceptable mechanical performance and provided sustained drug release, biocompatibility, and significant antibacterial activity.
    explanation: Abstract, conclusions.
status: PROPOSED
category: RESIN_COMPOSITE
