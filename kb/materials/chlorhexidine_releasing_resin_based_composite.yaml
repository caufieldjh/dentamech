adverse_effects:
  - name: Reduced polymerization and strength at higher chlorhexidine loading
    effect_category: MECHANICAL_FAILURE
    description: Chlorhexidine can interfere with polymerization. Higher loadings agglomerated the filler, lowered conversion and lowered strength.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106633
        reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: However, direct incorporation of chlorhexidine into a resin matrix may adversely affect the process of polymerisation
        explanation: Introduction, background.
      - reference: DOI:10.1016/j.jdent.2026.106633
        reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Increasing chlorhexidine concentration resulted in particle agglomeration, reduced double-bond conversion rate, and decreased mechanical strength.
        explanation: Abstract, results.
  - name: Cytotoxicity at higher chlorhexidine loading
    effect_category: TOXICITY
    description: At 6% and 10% chlorhexidine loading, cell activity fell over time in vitro.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106633
        reference_title: Enhanced antimicrobial properties of POSS-modified composite resin with chlorhexidine-loaded bioactive glass
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: resulted in a sustained decrease in cell activity, reflecting the potential risk of this system at high loading concentrations.
        explanation: 'Discussion: the C6 and C10 groups.'
discussions:
  - discussion_id: ohd-term-chlorhexidine-releasing-resin-based-composite
    kind: CURATION_TODO
    status: OPEN
    prompt: 'OHD has no term for a chlorhexidine-releasing resin-based composite (l~chlorhexidine, l~antibacterial and l~antimicrobial find nothing, searched 2026-11-20). Propose one at this grain, as a child of the proposed antibacterial resin-based composite: a resin-based composite that releases chlorhexidine as its antimicrobial agent, whatever the carrier.'
  - discussion_id: evidence-threshold-chlorhexidine-releasing-resin-based-composite
    kind: OPEN_QUESTION
    status: OPEN
    prompt: 'This record rests on one in vitro and animal study of one formulation. Whether that is enough evidence for an experimental record is question 3 for the project''s dental materials expert on #50. Until other formulations are curated, the composition and values here are those of that study only.'
notes: 'The composition is the single formulation of DOI:10.1016/j.jdent.2026.106633; other chlorhexidine-releasing composites may use other resins and carriers. The paper is internally inconsistent in places that are not quoted: the 2% group''s double-bond conversion is 50.1% in the text and 48.44% in the table, one sentence calls a flexural value compressive, and one optical density for the control group reads 11.969. Antibacterial tests used Staphylococcus aureus and Escherichia coli, not cariogenic species such as Streptococcus mutans. Parent is the proposed antibacterial resin-based composite, the curator''s choice.'
