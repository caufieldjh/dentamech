id: dentamech:644a236e-c751-4a06-bb50-1172a61590c0
name: Denture base polymer
description: 'A polymer or copolymer processed into the denture base: the part of a denture that rests on the soft tissues and carries the artificial teeth. ISO 20795-1 classifies these materials by how they are processed and sets their requirements; FDA regulates them as class II devices.'
description_evidence:
  - reference: ISO.20795:1_2013_2
    reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
    supports: SUPPORT
    evidence_source: STANDARD
    snippet: that part of a denture which rests on soft tissue foundations and to which artificial teeth are added
    explanation: Definition 3.4, denture base.
  - reference: ISO.20795:1_2013_2
    reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
    supports: SUPPORT
    evidence_source: STANDARD
    snippet: This part of ISO 20795 classifies denture base polymers and copolymers and specifies their requirements.
    explanation: Scope, 1.1.
status: PROPOSED
category: POLYMER
synonyms:
  - denture base resin
  - denture base material
composition:
  - name: Powder
    role: POWDER
    description: Polymeric particles, mixed with the liquid into a mouldable dough or fluid resin, for materials supplied as powder and liquid.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: polymeric particles to be mixed with monomeric liquid to form a mouldable dough or fluid resin mixture used for forming denture bases
        explanation: Definition 3.8, powder.
  - name: Liquid
    role: LIQUID
    description: Monomeric liquid, mixed with the powder, for materials supplied as powder and liquid.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: monomeric liquid to be mixed with polymeric particles to form a mouldable dough or fluid resin mixture used for forming denture bases
        explanation: Definition 3.7, liquid.
  - name: Methyl methacrylate
    role: OTHER
    description: The monomer FDA names as an example material, and the one whose residue ISO 20795-1 limits in every type. Not every denture base polymer is made from it.
    chemical:
      preferred_term: methyl methacrylate
      term:
        id: CHEBI:34840
        label: methyl methacrylate
    evidence:
      - reference: CFR:872.3760
        reference_title: 21 CFR 872.3760 Denture relining, repairing, or rebasing resin
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: a device composed of materials such as methylmethacrylate
        explanation: FDA names methyl methacrylate as an example of what the device is composed of, not the only material.
properties:
  - name: Ultimate flexural strength
    property_type: FLEXURAL_STRENGTH
    value: '>=65 (Types 1, 3, 4, 5); >=60 (Type 2)'
    unit: MPa
    test_method: ISO 20795-1:2013, 8.5.3.5
    conditions: Requirement of ISO 20795-1:2013, second edition.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: the ultimate flexural strength shall be not less than 65 MPa for Type 1, Type 3, Type 4, and Type 5 polymers and not less than 60 MPa for Type 2 polymers
        explanation: Requirement 5.2.8.
  - name: Flexural modulus
    property_type: ELASTIC_MODULUS
    value: '>=2000 (Types 1, 3, 4, 5); >=1500 (Type 2)'
    unit: MPa
    test_method: ISO 20795-1:2013, 8.5.3.5
    conditions: Requirement of ISO 20795-1:2013, second edition.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: the flexural modulus of the processed polymer shall be at least 2 000 MPa for Type 1, Type 3, Type 4, and Type 5 polymers and at least 1 500 MPa for Type 2 polymers
        explanation: Requirement 5.2.9.
  - name: Residual methyl methacrylate monomer
    property_type: OTHER
    value: <=2.2 (Types 1, 3, 4, 5); <=4.5 (Type 2)
    unit: '% mass fraction'
    test_method: ISO 20795-1:2013, 8.8
    conditions: Requirement of ISO 20795-1:2013, second edition.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: The upper limit (maximum) for residual methyl methacrylate is 2,2 % mass fraction for denture base polymers of Type 1, Type 3, Type 4, and Type 5. ... The upper limit (maximum) for residual methyl methacrylate is 4,5 % mass fraction for denture base polymers of Type 2.
        explanation: Requirement 5.2.13. ISO writes decimal commas.
  - name: Water sorption
    property_type: WATER_SORPTION
    value: <=32
    unit: µg/mm³
    test_method: ISO 20795-1:2013, 8.9
    conditions: Requirement of ISO 20795-1:2013, second edition.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: the increase in mass per volume (water sorption) shall not exceed 32 µg/mm3
        explanation: Requirement 5.2.14; the text extraction flattens mm³ to mm3.
  - name: Solubility
    property_type: SOLUBILITY
    value: <=1.6 (Types 1, 3, 4, 5); <=8.0 (Type 2)
    unit: µg/mm³
    test_method: ISO 20795-1:2013, 8.9
    conditions: Requirement of ISO 20795-1:2013, second edition.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: the loss in mass (soluble matter) per volume shall not exceed 1,6 µg/mm3 for Type 1, Type 3, Type 4, and Type 5 polymers and shall not exceed 8,0 µg/mm3 for Type 2 polymers
        explanation: Requirement 5.2.15.
  - name: Maximum stress intensity factor, improved impact resistance
    property_type: FRACTURE_TOUGHNESS
    value: '>=1.9'
    unit: MPa·m^1/2
    test_method: ISO 20795-1:2013, 8.6
    conditions: Applies only where the manufacturer claims improved impact resistance.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: Where a manufacturer claims a material with improved impact resistance, the maximum stress intensity factor shall be at least 1,9 MPa m1/2 ... the total fracture work shall be at least 900 J/m2
        explanation: Requirement 5.2.10, quoted with 5.2.11; m1/2 is m^1/2 flattened by text extraction.
  - name: Total fracture work, improved impact resistance
    property_type: OTHER
    value: '>=900'
    unit: J/m²
    test_method: ISO 20795-1:2013, 8.6
    conditions: Applies only where the manufacturer claims improved impact resistance.
    evidence:
      - reference: ISO.20795:1_2013_2
        reference_title: 'Dentistry — Base polymers — Part 1: Denture base polymers'
        supports: SUPPORT
        evidence_source: STANDARD
        snippet: Where a manufacturer claims a material with improved impact resistance, the maximum stress intensity factor shall be at least 1,9 MPa m1/2 ... the total fracture work shall be at least 900 J/m2
        explanation: Requirement 5.2.11, quoted with 5.2.10; J/m2 is J/m² flattened by text extraction.
    description: Work of fracture, an energy per area, not a stress intensity, so not typed FRACTURE_TOUGHNESS. The companion requirement on the maximum stress intensity factor is.
  - name: Surface roughness and wettability after gastric acid and cleaning
    property_type: OTHER
    conditions: 'In vitro: one heat-polymerized and two 3D-printed denture base resins, erosive cycling with gastric acid, then four routine cleaning protocols.'
    description: 'Roughness and hydrophilicity rose in every resin tested. OTHER: the enum has no type for roughness or wettability.'
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Erosive cycling followed by cleaning increased surface roughness ... and hydrophilicity ... in all resins.
        explanation: Abstract, results; the p-values are omitted.
      - reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Despite stable chemical structure and bulk properties, gastric acid exposure combined with routine cleaning impaired surface integrity, color stability, and resistance to microbial colonization of denture base resins.
        explanation: Abstract, conclusions.
      - &id001
        reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: fabricated from one heat-polymerized resin (HT) and two 3D-printed resins
        explanation: 'Abstract, methods: the materials the finding covers.'
  - name: Colour stability after gastric acid and cleaning
    property_type: COLOR_STABILITY
    conditions: 'In vitro: one heat-polymerized and two 3D-printed denture base resins, erosive cycling with gastric acid, then four routine cleaning protocols.'
    description: Colour changed perceptibly in every resin tested.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: all resins exhibited clinically perceptible color changes ... and increased Candida albicans colonization
        explanation: Abstract, results; the p-values are omitted.
      - *id001
  - name: Candida albicans colonization after gastric acid and cleaning
    property_type: OTHER
    conditions: 'In vitro: one heat-polymerized and two 3D-printed denture base resins, erosive cycling with gastric acid, then four routine cleaning protocols.'
    description: 'Colonization by Candida albicans increased in every resin tested. OTHER: the enum has no type for microbial colonization; ANTIBACTERIAL_ACTIVITY is a material''s own effect on bacteria.'
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: all resins exhibited clinically perceptible color changes ... and increased Candida albicans colonization
        explanation: Abstract, results; the p-values are omitted.
      - reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: fabricated from one heat-polymerized resin (HT) and two 3D-printed resins
        explanation: 'Abstract, methods: the materials the finding covers.'
  - name: Water sorption, solubility and chemical structure after gastric acid and cleaning
    property_type: WATER_SORPTION
    conditions: 'In vitro: one heat-polymerized and two 3D-printed denture base resins, erosive cycling with gastric acid, then four routine cleaning protocols.'
    description: Water sorption and solubility stayed low and unchanged, and infrared spectroscopy showed no chemical degradation. Typed WATER_SORPTION; solubility and structure are part of the same finding.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Water sorption and solubility remained low and unchanged ... and FTIR analysis revealed no chemical degradation. However, all resins exhibited clinically perceptible color changes
        explanation: Abstract, results; the p-values are omitted.
      - reference: DOI:10.1016/j.jdent.2026.106635
        reference_title: Impact of cleaning protocols on surface integrity and biofilm formation of heat-polymerized and 3D-printed denture base resins after gastric acid exposure
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: fabricated from one heat-polymerized resin (HT) and two 3D-printed resins
        explanation: 'Abstract, methods: the materials the finding covers.'
clinical_uses:
  - name: Denture base
    use_context: PROSTHODONTIC
    description: Forming a new denture base, relining the tissue surface of a denture, and repairing a fractured denture.
    evidence:
      - reference: CFR:872.3760
        reference_title: 21 CFR 872.3760 Denture relining, repairing, or rebasing resin
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: intended to reline a denture surface that contacts tissue, to repair a fractured denture, or to form a new denture base
        explanation: The intended uses in the FDA identification.
