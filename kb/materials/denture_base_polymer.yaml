discussions:
  - discussion_id: ohd-term-denture-base-polymer
    kind: CURATION_TODO
    status: UNDER_DISCUSSION
    evidence:
      - reference: url:https://github.com/oral-health-and-disease-ontologies/ohd-ontology/issues/206
        reference_title: 'NTR: denture base polymer'
        supports: NO_EVIDENCE
        explanation: The new term request filed on OHD for this record's term.
    prompt: 'OHD has no term for denture base polymer (l~denture base finds no material, searched 2026-11-18 and 2026-11-19). Propose one, at this grain, named as in ISO 20795-1. Where it belongs, under dental restoration material (OHD:0000000) or in a prosthodontic material branch, is for OHD to decide; that answer would also give this record its parents. Subtypes would follow ISO''s types (heat-polymerizable, autopolymerizable, thermoplastic, light-activated, microwave cured), with additively manufactured resins, which the 2013 edition does not classify. See issue #51.'
  - discussion_id: classification-denture-base-polymer
    kind: CURATION_TODO
    status: OPEN
    prompt: 'purpose and restorative_class are unset. Is a denture base polymer RESTORATIVE with restorative_class POLYMER? Asked of the project''s dental materials expert in #51.'
  - discussion_id: setting-mechanisms-denture-base-polymer
    kind: CURATION_TODO
    status: OPEN
    prompt: 'setting_mechanisms is unset. ISO 20795-1 types are heat-polymerizable, autopolymerizable, thermoplastic, light-activated and microwave cured, and SettingMechanismEnum has values for only some of these (SELF_CURED, LIGHT_CURED; ADDITIVE_MANUFACTURING for printed resins). Listing only those would misdescribe the class; the enum needs values for heat and microwave polymerization and thermoplastic moulding first. Tracked in #59.'
notes: Every requirement here is from ISO 20795-1:2013, the second edition, which FDA recognizes as consensus standard 4-232. The ISO catalogue link the project's expert gave (iso.org/standard/91143) is a different catalogue entry from the copy curated here (62277); which edition it names has not been checked. ISO 20795-1:2013 sorts denture base polymers into Type 1 heat-polymerizable (Class 1 powder and liquid, Class 2 plastic cake), Type 2 autopolymerizable (Class 1 powder and liquid, Class 2 powder and liquid for pour-type resins), Type 3 thermoplastic blank or powder, Type 4 light-activated and Type 5 microwave cured. 3D-printed denture base resins fall in none of these, so the 2013 limits are not applied to them here. FDA's guidance Denture Base Resins - Performance Criteria for Safety and Performance Based Pathway is a lead not yet read.
