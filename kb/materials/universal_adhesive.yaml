id: dentamech:ce8e977d-8e94-4316-9566-d772b60ee547
name: Universal adhesive
description: A resin bonding agent that can be applied in more than one etching mode, self-etch, selective-etch or etch-and-rinse, to bond a resin-based restoration to tooth structure. FDA regulates resin tooth bonding agents as class II devices.
description_evidence:
  - reference: DOI:10.1016/j.jdent.2026.106629
    reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: for universal adhesives applied in selective-etch and etch-and-rinse modes
    explanation: 'Introduction, citing a randomized trial: universal adhesives are applied in more than one etching mode.'
  - reference: DOI:10.1016/j.jdent.2026.106629
    reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: using a self-etch protocol with Single Bond Universal (3 M ESPE)
    explanation: 'Methods: the same adhesive used in self-etch mode.'
status: PROPOSED
category: ADHESIVE
parents:
  - OHD:0000000
synonyms:
  - multi-mode adhesive
properties:
  - name: Micro-shear bond strength to dentin
    property_type: BOND_STRENGTH
    value: 48.75 ± 10.27 to 65.83 ± 25.87 (group means)
    unit: MPa
    test_method: Micro-shear bond strength, composite micro-rods on dentin discs
    conditions: 'In vitro: Single Bond Universal with Filtek Z250 XT on human third molar dentin, with or without diode laser pretreatment, ten specimens per group. Group means did not differ significantly.'
    description: Mixed failures were the most common in every group, and pure adhesive failures were rare.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: SBS values ranged from 48.75 ± 10.27 MPa in Group II to 65.83 ± 25.87 MPa in Group III, with no statistically significant differences among the groups
        explanation: 'Results 3.1.2: every group used this adhesive; the untreated control (Group IV) had 54.88 ± 13.81 MPa in Table 2.'
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: A universal adhesive (Single Bond Universal; 3 M ESPE, Neuss, Germany) was applied with a micro-brush using a rubbing motion for
        explanation: 'Methods 2.1: the adhesive tested.'
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: filled with Filtek Z250 XT composite (3 M ESPE, St. Paul, MN, USA)
        explanation: 'Methods 2.1: the composite bonded.'
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Failure mode analysis revealed that mixed failures were the most prevalent pattern in all groups
        explanation: Results 3.1.2.
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Pure adhesive failures were rare, observed in only one specimen each in Groups I, II, and III
        explanation: Results 3.1.2.
clinical_uses:
  - name: Bonding composite restorations to dentin
    use_context: ADHESIVE
    description: Applied to a prepared tooth surface before a resin-based composite, to retain the restoration; in the trial curated, in self-etch mode for non-carious cervical lesions.
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Composite restorations were performed after a 3-minute waiting period using a self-etch protocol with Single Bond Universal (3 M ESPE)
        explanation: "Methods: the adhesive's use in the trial."
      - reference: CFR:872.3200
        reference_title: 21 CFR 872.3200 Resin tooth bonding agent
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: intended to be painted on the interior of a prepared cavity of a tooth to improve retention of a restoration, such as a filling
        explanation: The intended use FDA names for resin tooth bonding agents.
clinical_performance:
  - name: Fracture and retention of cervical composite restorations, 24 months
    measure_type: OTHER
    follow_up_years: 2.0
    population: 36 non-carious cervical lesions in a split-mouth randomized trial, restored with Single Bond Universal in self-etch mode and Filtek Z250, in four groups of nine (three diode laser pretreatments and an untreated control).
    description: 'Fracture and retention, scored by FDI functional criteria, were excellent in every group, with no significant difference between groups. OTHER: the outcome is an FDI score, not a retention rate.'
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Fracture and retention outcomes were excellent across all groups
        explanation: Results 3.2.2, FDI functional criteria.
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Clinically, a split-mouth randomized controlled trial was performed on 36 NCCLs, equally allocated into four groups, restored with composite resin and assessed at 6, 12, and 24 months using FDI esthetic, functional, and biological criteria
        explanation: 'Abstract, methods: the population.'
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Overall, all restorations performed well functionally, and no statistically significant differences were detected between the laser-treated groups and the control group.
        explanation: Results 3.2.2.
