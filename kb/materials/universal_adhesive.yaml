discussions:
  - discussion_id: ohd-term-universal-adhesive
    kind: CURATION_TODO
    status: OPEN
    prompt: 'OHD has no term for a dental adhesive or bonding agent (l~adhesive, l~bonding, l~bond and l~primer find no material, searched 2026-11-20). OHD has hydroxyethyl methacrylate (OHD:0001082), an adhesive monomer, under dental restoration material. Propose a term for dental adhesive (resin tooth bonding agent, as FDA names it), with universal adhesive as a child defined by use in more than one etching mode. Its parent here is dental restoration material (OHD:0000000), the curator''s choice until a term exists.'
  - discussion_id: placement-restoration-success-universal-adhesive
    kind: OPEN_QUESTION
    status: OPEN
    prompt: 'The 33.3% 24-month success item is success of adhesive and Filtek Z250 together, its failures esthetic, and is here at the maintainer''s request. Read alone, a success rate on this record may be taken as adhesive performance. When a source with universal-adhesive retention rates is curated, consider moving the item to the resin-based composite record and recording retention here instead.'
  - discussion_id: composition-universal-adhesive
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: 'Composition is not recorded: the trial curated names the product but not its ingredients. A source on universal adhesive chemistry (functional monomers such as 10-MDP, HEMA, solvents, silane) should be fetched and quoted.'
  - discussion_id: evidence-universal-adhesive
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: 'The definition (use in more than one etching mode) rests on a sample-size sentence and a methods sentence of one trial; a source that defines the class must replace them before this record goes beyond DRAFT. The only source is a trial of diode laser pretreatment, in which the adhesive is the same in every arm; it says how this adhesive performed, not how universal adhesives compare with other adhesives. The trial cites clinical studies of universal adhesives in cervical lesions (for example Peumans 2023, Haak 2023, Tepe 2024), which are leads to fetch.'
notes: 'Evidence is from one split-mouth trial with an in vitro arm (DOI:10.1016/j.jdent.2026.106629). Its control group fell to 33.3% success at 24 months, from loss of surface luster and staining, which reflect the composite surface more than the adhesive; the figure is recorded with that caveat. Classification by purpose is left unset: an adhesive may be AUXILIARY or part of the restoration, which is question 1 for the project''s expert on #50.'
