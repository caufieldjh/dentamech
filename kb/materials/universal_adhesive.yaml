clinical_performance:
  - name: Restoration success with Filtek Z250, no pretreatment, 24 months (esthetic failures, not bond failures)
    measure_type: SUCCESS_RATE
    value: '33.3'
    unit: '%'
    follow_up_years: 2.0
    population: The untreated control arm of a split-mouth randomized trial, nine non-carious cervical lesions restored with Single Bond Universal in self-etch mode and Filtek Z250.
    comparator: 88.9% in each of the three diode laser pretreatment arms (nine lesions each).
    description: 'Success of the whole restoration, adhesive and Filtek Z250 composite together, not of the adhesive alone. All restorations succeeded at 6 and 12 months. By 24 months six of the nine control restorations had failed, any FDI score of 4 or 5 counting as failure. The failures were esthetic (surface luster and staining), while fracture and retention stayed excellent in every arm, so this is not a 66.7% failure rate of the bond; it says more about the composite surface. Kept at the maintainer''s request for the control arm''s clinical data.'
    evidence:
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: In contrast, the control group exhibited a substantial decline, with success decreasing to 33.3% and failure increasing to 66.7%.
        explanation: Results 3.2.4, at 24 months.
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: maintained high and identical success rates (88.9%)
        explanation: 'Results 3.2.4: the three laser arms, the comparator.'
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Restoration outcomes were determined based on the highest score assigned within the esthetic, functional, or biological categories, with any score of 4 or 5 classified as a failure.
        explanation: 'Results 3.2.4: how failure was defined.'
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: At both the 6- and 12-month evaluations, all groups demonstrated 100% success, with no recorded failures.
        explanation: Results 3.2.4.
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: whereas the control group showed significant esthetic deterioration over time
        explanation: 'Results 3.2.1: the failures were esthetic.'
      - reference: DOI:10.1016/j.jdent.2026.106629
        reference_title: 'Effect of diode laser on dentin surface properties, adhesive performance, and clinical outcomes of non-carious cervical lesion restorations: A 24-month split-mouth randomized controlled trial'
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Fracture and retention outcomes were excellent across all groups
        explanation: 'Results 3.2.2: the bond held in every arm.'
  - name: Fracture and retention of cervical composite restorations, 24 months
    measure_type: OTHER
    follow_up_years: 2.0
    population: 36 non-carious cervical lesions in a split-mouth randomized trial, restored with Single Bond Universal in self-etch mode and Filtek Z250, in four groups of nine (three diode laser pretreatments and an untreated control).
    description: 'Fracture and retention, scored by FDI functional criteria, were excellent in every group, with no significant difference between groups. OTHER: the outcome is an FDI score, not a retention rate.'
    evidence:
