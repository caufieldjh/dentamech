        snippet: Clinically, a split-mouth randomized controlled trial was performed on 36 NCCLs, equally allocated into four groups, restored with composite resin and assessed at 6, 12, and 24 months using FDI esthetic, functional, and biological criteria
        explanation: 'Abstract, methods: the population.'
