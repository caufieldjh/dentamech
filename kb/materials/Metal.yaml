notes: >-
  Abstract parent class. Every claim here is meant to hold for metallic restorative materials as a group;
  family-specific numbers belong on the children (Amalgam, Gold foil, Noble metal, High noble metal,
  Predominantly base metal, Stainless steel, Titanium and its subclasses).

  Regulatory. The class does not map to one regulation. Five device types in 21 CFR 872 subpart D span it
  (872.3060, 872.3070, 872.3330, 872.3350 and 872.3710), and they differ in a way worth keeping straight:
  872.3060 and 872.3710 are class II special controls and 510(k)-exempt subject to 872.9; 872.3330 and
  872.3350 are class I and 510(k)-exempt subject to 872.9; and 872.3070 alone is class II special controls
  and not exempt. All five regulation numbers, titles, identification paragraphs, classes, and product
  codes were re-verified against the CFR text at law.cornell.edu and the FDA product classification
  database on 2026-09-11; nothing was carried over from docs/regulatory.md or from memory. No regulation in
  subpart D names titanium as a crown and bridge material, so titanium restorations are not covered by a
  sixth row here.

  Standards. Five are recorded, each as FDA recognizes it, and all were verified in the Recognized
  Consensus Standards database. ISO 22674, Third edition 2022-08, recognition number 4-300, extent
  Complete, date of entry 05/29/2023, identically adopted as ANSI ADA Standard No. 134-2023. ISO 9693,
  Third edition 2019-10, recognition number 4-263, extent Complete, identically adopted as ANSI ADA
  Standard No. 38-2020, which covers the metal-ceramic use this entry records. ISO 24234, Third edition
  2021-08, recognition number 4-315, extent Complete, which covers the amalgam member. Three are needed
  rather than one because ISO 22674 states that it "does not apply to alloys for dental amalgam (see ISO
  24234)", so no single standard spans the class. ISO 10271, Third edition 2020-08, recognition number
  4-265, extent Complete, identically adopted as ANSI ADA Standard No. 97-2022, and ISO 7405, Third
  edition 2018-10 Corrected version 2018-12, recognition number 4-261, extent Complete, were added in the
  fourth pass and cover the corrosion and biocompatibility test methods respectively. The Standard class
  has no slot for edition or recognition number, so they are recorded here.

  Properties. Deliberately no numbers. Strength, hardness, elastic modulus, melting range, and density are
  all real for a given alloy but vary by more than an order of magnitude across the families, so a class-
  level number would be an invention. The five rows that are here carry no value: corrosion, which the
  literature treats as the property governing the whole class; plastic deformation rather than brittle
  fracture, which is what the metallic bond buys and what separates this class from the ceramics; the
  dependence of any measured property on the fabrication route, which is a caution that applies to every
  number recorded on the children; and the ISO 22674 type classification, which states the same point
  positively - the governing standard sets mechanical requirements by numbered type rather than one
  class-level requirement, so an alloy is qualified against a type. The fifth, added in a later pass, is the marginal and internal fit of additively manufactured restorations, which is governed by build parameters and preparation design rather than by the alloy, and which is the only evidence on this entry for the ADDITIVE_MANUFACTURING setting mechanism.

  Left out. Products, because brands belong on the children. Amalgam-associated oral lichenoid lesions,
  because that evidence base is amalgam-specific and belongs on the Amalgam entry; the class-level
  lichenoid row added in the eighth pass rests on a series in which the patch-test positives were led by
  palladium and gold rather than by amalgam, which is what makes it class-level. EU MDR, Health Canada, and
  other regulators, because none were verified against a primary source.

  Provider. The deep research step could not run through the normal shim: the claude_code provider reports
  UNREACHABLE (not logged in) and the EDISON, FUTUREHOUSE and OPENAI keys are present in the environment
  but empty, so no provider is callable. Because the curating agent is itself Claude Code, the research
  pass was run directly instead and is recorded in research/Metal-deep-research-claude_code.md; PubMed was
  searched through the E-utilities API and every abstract quoted was cached through just fetch-reference,
  so all snippets are checkable against references_cache/ rather than against a model's recollection.

  Curation. This entry was built over several passes and every regulation, class, product code and
  standards recognition record in it has been re-derived from the CFR text at law.cornell.edu and the FDA
  product classification and Recognized Consensus Standards databases more than once, by passes starting
  from the primary sources rather than from this file, always reaching the values recorded here. Two things
  future editors should know. A report of zero total checks from the reference validator means every
  snippet was checked and passed, not that nothing was checked; this was confirmed by running it against a
  deliberately corrupted quote. And every literature snippet in this entry has been checked against the
  abstract as PubMed serves it, with the reference cache bypassed, not only against references_cache/.
  That distinction matters here: linkml-reference-validator fetches article full text by default, so a
  cached record can hold the publisher's rendition of the whole paper, and a quote taken from the body of
  a paper passes the cached check while failing the abstract. Three snippets in earlier passes of this
  entry were body text of that kind - two from PMID:38702521 and one from PMID:34204569 - and were
  replaced with abstract-sourced quotes. Every cached record this entry cites is therefore committed as
  content_type abstract_only, and no snippet here depends on text outside the abstract PubMed serves.
  That state is not self-sustaining: just validate-references fetches full text by default, so merely
  running it rewrites those records back into full-text supersets - and for PMID:25935732 it refills the
  record with the Geneva repository's page furniture rather than the article. Run it with --no-full-text,
  or discard the references_cache/ rewrite instead of staging it. The pass-by-pass account of the
  automation that produced this entry lives in the git history and the pull request thread, not here.
