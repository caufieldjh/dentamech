        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: intended for use in the fabrication of cast or porcelain-fused-to-metal crown and bridge restorations
        explanation: Intended use of the noble metal alloy device type.
      - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3710
