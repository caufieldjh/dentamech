        reference_title: FDA Recognized Consensus Standards, ISO 22674 Third edition 2022-08
        supports: PARTIAL
        evidence_source: STANDARD
        snippet: This document specifies requirements and test methods for metallic materials that are suitable for the fabrication of dental restorations and appliances.
        explanation: The standard covers metallic restorations generally; it does not name onlays. The onlay procedure itself is a named OHD class.
      - reference: PMID:38702521
        reference_title: Long-term performance of ceramic in/-onlays vs. cast gold partial crowns - a retrospective clinical study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: CIOs and CGPCs made by supervised undergraduate students are proper restoration types in posterior teeth in the long-term.
        explanation: Cast gold partial crowns, a cusp-covering indirect restoration close to the onlay, performed well over the long term. PARTIAL because a partial crown is not named an onlay.
  - name: Porcelain-fused-to-metal implant-supported single crowns
    use_context: IMPLANT
    procedure:
      preferred_term: porcelain fused to metal dental implant crown attachment
      term:
        id: OHD:0000298
        label: porcelain fused to metal dental implant crown attachement procedure
    evidence:
      - reference: PMID:30328190
        reference_title: A systematic review of the survival and complication rates of zirconia-ceramic and metal-ceramic single crowns.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'Meta-analysis revealed an estimated 5-year survival rate of 98.3% (95% CI: 96.8-99.1) for metal-ceramic implant supported SCs (n = 4,363)'
        explanation: Pooled survival of metal-ceramic implant-supported single crowns, over 4,363 crowns.
  - name: Fixed dental prostheses
    use_context: INDIRECT_RESTORATION
    description: Multiple-unit tooth- and implant-supported fixed dental prostheses with a metal framework.
    procedure:
      preferred_term: fixed partial denture restoration
      term:
        id: OHD:0000313
        label: fixed partial denture restoration procedure
    evidence:
      - reference: PMID:30328185
        reference_title: A systematic review of the survival and complication rates of zirconia-ceramic and metal-ceramic multiple-unit fixed dental prostheses.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Hence, metal ceramics seems to stay the golden standard for implant-supported multiple-unit FDPs.
        explanation: States the standing of metal-ceramic multiple-unit prostheses against the ceramic comparator.
      - reference: PMID:25935732
        reference_title: 'All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part II: Multiple-unit FDPs.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'Meta-analysis of the included studies indicated an estimated 5-year survival rate of metal-ceramic FDPs of 94.4% (95% CI: 91.2-96.5%).'
        explanation: Tooth-supported metal-ceramic FDPs, the tooth-supported half of this use.
  - name: Removable prosthodontic frameworks
    use_context: PROSTHODONTIC
    description: Metallic materials for removable restorations and appliances. Which alloys and fabrication routes are used belongs on the children.
    procedure:
      preferred_term: removable prosthodontics
      term:
        id: OHD:0000247
        label: removable prosthodontics procedure
    evidence:
      - reference: url:https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfStandards/detail.cfm?standard__identification_no=44253
        reference_title: FDA Recognized Consensus Standards, ISO 22674 Third edition 2022-08
        supports: PARTIAL
        evidence_source: STANDARD
        snippet: Dentistry - Metallic materials for fixed and removable restorations and appliances
        explanation: The title of the standard FDA recognizes for this class names removable restorations and appliances alongside fixed ones. A title is partial support for the use, and names no alloy.
  - name: Preformed crowns as functional restorations
    use_context: TEMPORARY
    procedure:
      preferred_term: stainless steel crown
      term:
        id: OHD:0000163
        label: stainless steel crown restoration procedure
    description: Preformed stainless steel crowns, used to restore carious primary molars. The use_context follows the regulation, which frames the device as interim.
    indications:
      - Functional restoration until a permanent crown is constructed
      - Functional restoration for a badly decayed deciduous tooth until the adult tooth erupts
    evidence:
      - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3330
        reference_title: 21 CFR 872.3330 Preformed crown
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: It is intended for use as a functional restoration until a permanent crown is constructed.
        explanation: The intended use stated for the preformed crown device type.
      - reference: PMID:26718872
        reference_title: Preformed crowns for decayed primary molar teeth.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: They can be made completely of stainless steel (know as 'preformed metal crowns' or PMCs), or to give better aesthetics, may be made of stainless steel with a white veneer cover or made wholly of a white ceramic material.
        explanation: Preformed crowns for decayed primary molars made wholly of stainless steel are the preformed metal crowns, which is what the stainless steel crown procedure term names.
      - reference: PMID:36151937
        reference_title: 'Outcomes of preformed metal crowns placed with the conventional and Hall techniques: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Preformed metal crowns (PMCs) have been used to restore carious primary molars and have a high success and survival rate.
        explanation: The clinical use on primary molars.
