properties:
  - name: Corrosion in the oral environment
    property_type: CORROSION_RESISTANCE
    description: A class-level property of metals in the mouth. It is qualitative here because the rate depends on the family and the microstructure, not on membership of the class; per-family values belong on the children.
    evidence:
      - reference: PMID:10668036
        reference_title: 'Biocompatibility of dental casting alloys: a review.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: The single most relevant property of a casting alloy to its biologic safety is its corrosion.
        explanation: Narrative evidence-based tutorial. Establishes corrosion as the governing property for the class.
      - reference: PMID:10668036
        reference_title: 'Biocompatibility of dental casting alloys: a review.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: To minimize biologic risks, dentists should select alloys that have the lowest release of elements (lowest corrosion).
        explanation: Corrosion resistance varies within the class and drives material selection.
      - reference: PMID:23895079
        reference_title: Nickel alloys in the oral environment.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: nickel-casting alloys have low costs and favorable physical properties, but are corrosion-prone in the oral environment
        explanation: Narrative review. Shows the spread within the class; the nickel-containing family sits at the corrosion-prone end.
      - reference: PMID:36363067
        reference_title: Minimization of Adverse Effects Associated with Dental Alloys.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: In the oral cavity, metal structures are exposed to various mechanical and chemical factors. Consequently, metal ions are released into the oral fluid, which may negatively affect the surrounding tissues and even internal organs.
        explanation: Comprehensive literature review. States ion release as a general consequence of corrosion for metallic oral appliances.
      - reference: PMID:12175579
        reference_title: Biological interactions of dental cast alloys with oral tissues.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: All dental cast alloys release metal ions into the oral environment which have the potential to interact with the oral tissues. Amount and type of metal elements released are varying and not directly related to the composition of the alloy.
        explanation: Literature survey. Establishes ion release as universal across the cast members, and states the reason this entry records no class-level release figure - release does not track composition, so a number measured on one alloy would not generalise to the class.
      - reference: PMID:32490402
        reference_title: Ion release from three different dental alloys - effect of dynamic loading and toxicity of released elements.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: According to the threshold defined in ISO 22674, only low concentrations of released elements were observed for both corrosion tests.
        explanation: One Pd-Ag and two Co-Cr alloys, spanning the noble and base families, released only low concentrations of elements under static and dynamic corrosion testing, judged against the ISO 22674 threshold. PARTIAL because three alloys cannot bound the class.
  - name: Fracture of the metal is uncommon compared with ceramics
    property_type: OTHER
    description: In the cited clinical series, fracture of the restorative material limits the ceramic comparators far more than it limits the metal restorations. In one long-term cohort, ceramic fracture was the leading complication of ceramic in- and onlays and did not appear among the complications of cast gold partial crowns. Metal-ceramic fixed dental prosthesis frameworks do fracture, but rarely; the five-year rate is recorded under clinical_performance. Recorded qualitatively, without a strength or toughness value, because those vary widely across the families and belong on the children.
    evidence:
      - reference: PMID:38702521
        reference_title: Long-term performance of ceramic in/-onlays vs. cast gold partial crowns - a retrospective clinical study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: Complications in CIOs (n = 149) were ceramic fracture (6.7%), secondary caries (4.7%), endodontic complication (2.7%) and tooth fracture (1.3%) compared to CGPCs (n = 147) with endodontic complication (8.8%), secondary caries (4.8%) and decementation (2.0%).
        explanation: One cohort of cast gold partial crowns. Fracture of the metal does not appear among their complications, while ceramic fracture leads for the ceramic comparator. PARTIAL because one gold cohort cannot speak for every family.
      - reference: PMID:38702521
        reference_title: Long-term performance of ceramic in/-onlays vs. cast gold partial crowns - a retrospective clinical study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: The clinical long-term performance was mostly limited by ceramic fractures in CIOs and endodontic complications in CGPCs.
        explanation: The authors' summary of what limited each material in the same cohort.
      - reference: PMID:25935732
        reference_title: 'All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part II: Multiple-unit FDPs.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Significantly more framework fractures were reported for reinforced glass ceramic FDPs (8.0%) and glass-infiltrated alumina FDPs (12.9%) compared to metal-ceramic FDPs (0.6%) and densely sintered zirconia FDPs (1.9%) in 5 years in function.
        explanation: Metal frameworks fracture, at 0.6% in five years, less often than the glass ceramic and alumina frameworks.
  - name: ISO 22674 mechanical type classification
    property_type: OTHER
    test_method: ISO 22674
    description: Why this entry records no class-level strength or modulus, stated positively. The governing standard does not set one requirement for metallic restorative materials; it sets mechanical requirements by numbered type, and an alloy is qualified for a given restoration design by meeting the requirements of a type. The type an alloy falls into, and its measured values, belong on the children. The numeric criteria that define the types are not quoted here because ISO 22674 is not open access and no cached abstract states them.
    evidence:
      - reference: PMID:34204569
        reference_title: Mechanical Properties of Dental Alloys According to Manufacturing Process.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: All test specimens complied with the requirements of the international standard ISO 22674 for dental alloys.
        explanation: Establishes ISO 22674 as the standard whose requirements dental alloy specimens are measured against. Recorded as PARTIAL because the abstract states conformity to the standard without stating the type system itself.
      - reference: PMID:40268421
        reference_title: Accuracy and mechanical properties of denture clasps fabricated utilizing pre-sintered Co-Cr alloy discs.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: In terms of mechanical properties, the pre-sintered clasps exhibited the highest elongation, meeting the standards for Type 4 metals as specified by ISO 22674:2022.
        explanation: The type system in use. A Co-Cr alloy is qualified by being shown to meet the requirements of one numbered type, which is the mechanism this row records; the type reached depends on the fabrication route, so it belongs on the children rather than here.
  - name: Dependence of mechanical properties on fabrication route
    property_type: OTHER
    test_method: Tensile, 3-point bend, and microhardness testing
    description: A methodological caution that applies to every property recorded on the children. Casting, subtractive milling, and laser sintering of the same alloy significantly influence several mechanical properties, so a property value for a metal is only meaningful with its fabrication route attached. Demonstrated for cobalt-chromium; the numbers belong on the Cobalt chromium metal entry.
    evidence:
      - reference: PMID:39741083
        reference_title: Assessment of mechanical properties and microstructure of Co-Cr dental alloys manufactured by casting, milling, and 3D printing.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The mechanical properties and microstructures of Co-Cr dental alloys were significantly influenced by the fabrication method used.
        explanation: Establishes that fabrication route, not composition alone, determines the mechanical properties of a dental alloy. The three routes it compares - casting, CNC milling and direct laser metal sintering - are the CASTING, MILLING and ADDITIVE_MANUFACTURING members of setting_mechanisms; AMALGAMATION is not in its scope.
  - name: Marginal and internal fit of additively manufactured restorations
    property_type: OTHER
    test_method: Marginal and internal gap measurement on SLM-fabricated tooth-supported fixed dental prostheses
    description: 'The companion to the fabrication-route row above, and the only evidence on this entry for the ADDITIVE_MANUFACTURING member of setting_mechanisms, which was otherwise declared without support. Recorded because fit is the property the additive route actually puts at risk: it is governed by build parameters - printing orientation, layer thickness, laser settings - and by the preparation design, while the effect of the alloy itself is inconsistent across studies. That is the same pattern the corrosion row records for element release, and it is why this row is class-level and carries no value. The one parameter window the review does give is specific to cobalt-chromium and belongs on the Cobalt chromium metal entry.'
    evidence:
      - reference: PMID:41206334
        reference_title: 'Factors affecting the fit of metal-based restorations fabricated by selective laser melting: A systematic review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Key factors influencing the fit of SLM-fabricated FDPs included tooth finish line and preparation design, printing orientation, and printing parameters such as lamination layer thickness and laser settings.
        explanation: Systematic review of 16 studies on tooth-supported metal-based FDPs. Names the determinants of fit for the additive route; all are process or design variables rather than properties of the metal.
      - reference: PMID:41206334
        reference_title: 'Factors affecting the fit of metal-based restorations fabricated by selective laser melting: A systematic review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Evidence regarding the effects of alloy type and postprocessing steps, including heat treatment and ceramic veneering, remained inconsistent.
        explanation: The class-level finding. Fit does not track the alloy, which is what keeps this row on the parent rather than distributing it to the families, and mirrors the corrosion row's point that element release is not directly related to composition.
      - reference: PMID:41206334
        reference_title: 'Factors affecting the fit of metal-based restorations fabricated by selective laser melting: A systematic review.'
        supports: PARTIAL
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Within the limitations of current evidence, clinically acceptable fit was associated with cobalt chromium alloys printed at 0 or 30 degrees with a 25- to 50-µm layer thickness and optimized laser parameters.
        explanation: The review's own parameter window, recorded as partial support because it is cobalt-chromium specific and because the review states it only within the limits of the current evidence. The numbers belong on the Cobalt chromium metal entry, not here.
clinical_performance:
  - name: Five-year survival of metal-ceramic tooth-supported fixed dental prostheses
    measure_type: SURVIVAL_RATE
    value: '94.4'
    unit: '%'
    follow_up_years: 5.0
    population: 1796 metal-ceramic tooth-supported fixed dental prostheses across 40 included studies
    comparator: All-ceramic fixed dental prostheses
    description: The tooth-supported multiple-unit counterpart to the single-crown row below. Survival of all types of all-ceramic FDPs was lower, though only the glass-infiltrated alumina difference reached significance.
    evidence:
      - reference: PMID:25935732
        reference_title: 'All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part II: Multiple-unit FDPs.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'Meta-analysis of the included studies indicated an estimated 5-year survival rate of metal-ceramic FDPs of 94.4% (95% CI: 91.2-96.5%).'
        explanation: Pooled five-year survival for the metal-ceramic arm.
      - reference: PMID:25935732
        reference_title: 'All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part II: Multiple-unit FDPs.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Even though the survival rate of all-ceramic FDPs was lower than for metal-ceramic FDPs, the differences did not reach statistical significance except for the glass-infiltrated alumina FDPs (p=0.05).
        explanation: Source of the comparison with all-ceramic FDPs in the description.
  - name: Five-year framework fracture rate of metal-ceramic tooth-supported fixed dental prostheses
    measure_type: COMPLICATION_RATE
    value: '0.6'
    unit: '%'
    follow_up_years: 5.0
    population: 1796 metal-ceramic tooth-supported fixed dental prostheses across 40 included studies
    comparator: Reinforced glass ceramic, glass-infiltrated alumina, and densely sintered zirconia FDPs
    description: 'The clearest class-level argument for a metal framework: metal-ceramic FDPs fractured at the framework an order of magnitude less often than the glass ceramic alternatives.'
    evidence:
      - reference: PMID:25935732
        reference_title: 'All-ceramic or metal-ceramic tooth-supported fixed dental prostheses (FDPs)? A systematic review of the survival and complication rates. Part II: Multiple-unit FDPs.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Significantly more framework fractures were reported for reinforced glass ceramic FDPs (8.0%) and glass-infiltrated alumina FDPs (12.9%) compared to metal-ceramic FDPs (0.6%) and densely sintered zirconia FDPs (1.9%) in 5 years in function.
        explanation: Gives the metal-ceramic framework fracture rate against its ceramic comparators.
  - name: Five-year survival of metal-ceramic tooth-supported single crowns
    measure_type: SURVIVAL_RATE
    value: '97.1'
    unit: '%'
    follow_up_years: 5.0
    population: 3,509 metal-ceramic tooth-supported single crowns across 64 included studies
    comparator: Veneered and monolithic all-ceramic single crowns
    evidence:
      - reference: PMID:41489982
        reference_title: A Systematic Review and Meta-analysis Evaluating the Survival, Failure, and Complication Rates of Metal-Ceramic, Veneered, and Monolithic All-Ceramic Tooth-Supported Single Crowns-Part 1.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'Five-year survival rates were: 98.5% for monolithic lithium-disilicate reinforced glass-ceramic, 97.3% for veneered densely-sintered zirconia, 97.1% for metal-ceramic, 96.8% for monolithic densely-sintered zirconia, 95.7% for veneered leucite/lithium-disilicate reinforced glass-ceramic, 94.5% for densely-sintered alumina, 94.3% for glass-infiltrated alumina, 90.4% for feldspathic/silica-based ceramic.'
        explanation: Pooled five-year survival for metal-ceramic crowns, alongside the ceramic comparators.
      - reference: PMID:41489982
        reference_title: A Systematic Review and Meta-analysis Evaluating the Survival, Failure, and Complication Rates of Metal-Ceramic, Veneered, and Monolithic All-Ceramic Tooth-Supported Single Crowns-Part 1.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Lithium-disilicate and zirconia-based all-ceramic SCs achieve five-year survival rates comparable to metal-ceramic crowns.
        explanation: The review's own reading of the comparison.
  - name: Five-year survival of metal-ceramic implant-supported single crowns
    measure_type: SURVIVAL_RATE
    value: '98.3'
    unit: '%'
    follow_up_years: 5.0
    population: 4,363 metal-ceramic implant-supported single crowns across 35 included studies
    comparator: Zirconia implant-supported single crowns
    evidence:
      - reference: PMID:30328190
        reference_title: A systematic review of the survival and complication rates of zirconia-ceramic and metal-ceramic single crowns.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'Meta-analysis revealed an estimated 5-year survival rate of 98.3% (95% CI: 96.8-99.1) for metal-ceramic implant supported SCs (n = 4,363) compared to 97.6% (95% CI: 94.3-99.0) for zirconia implant supported SCs (n = 912).'
        explanation: Pooled five-year survival with the confidence interval and the ceramic comparator.
  - name: Five-year survival of metal-ceramic implant-supported fixed dental prostheses
    measure_type: SURVIVAL_RATE
    value: '98.7'
    unit: '%'
    follow_up_years: 5.0
    population: 932 metal-ceramic implant-supported fixed dental prostheses across 19 included studies
    comparator: Zirconia-ceramic implant-supported fixed dental prostheses
    evidence:
      - reference: PMID:30328185
        reference_title: A systematic review of the survival and complication rates of zirconia-ceramic and metal-ceramic multiple-unit fixed dental prostheses.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: 'Meta-analysis revealed an estimated 5-year survival rate of 98.7% (95% CI: 96.8%-99.5%) for metal-ceramic implant-supported FDPs, and of 93.0% (95% CI: 90.6%-94.8%) for zirconia-ceramic implant-supported FDPs (p < 0.001).'
        explanation: Pooled five-year survival, significantly higher than the zirconia comparator.
  - name: Five-year ceramic fracture and chipping on metal-ceramic implant-supported fixed dental prostheses
    measure_type: COMPLICATION_RATE
    value: '11.6'
    unit: '%'
    follow_up_years: 5.0
    population: 781 metal-ceramic implant-supported fixed dental prostheses across 13 studies
    comparator: Zirconia implant-supported fixed dental prostheses
    description: The veneering ceramic, not the metal framework, is what fractures. Recorded here because it is the dominant technical complication of the metal-ceramic form of the class.
    evidence:
      - reference: PMID:30328185
        reference_title: A systematic review of the survival and complication rates of zirconia-ceramic and metal-ceramic multiple-unit fixed dental prostheses.
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Thirteen studies including 781 metal-ceramic implant-supported FDPs estimated a 5-year rate of ceramic fractures and chippings to be 11.6% compared with a significantly higher (p < 0.001) complication rate for zirconia implant-supported FDPs of 50%, reported in a small study with 13 zirconia implant-supported FDPs.
        explanation: The complication rate and its comparator, with the size of the comparator study stated.
  - name: Long-term survival of cast gold partial crowns
    measure_type: SURVIVAL_RATE
    value: '92.6'
    unit: '%'
    follow_up_years: 14.9
    population: 163 posterior (pre-)molar cast gold partial crowns placed by supervised undergraduate students, the Kaplan-Meier survival analysis set
    comparator: Ceramic inlays and onlays (Empress I)
    description: The only row here for a non-veneered cast metal restoration, and the longest follow-up in this entry. Every other performance row is metal-ceramic, so this one bounds how the metal itself behaves when it is not carrying a veneering ceramic.
    evidence:
      - reference: PMID:38702521
        reference_title: Long-term performance of ceramic in/-onlays vs. cast gold partial crowns - a retrospective clinical study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: The cumulative survival rates of CGPCs were 92.6% after a mean service time of 14.9 years and 91.8% after 23.5 years.
        explanation: Kaplan-Meier cumulative survival for the cast metal arm, out to 23.5 years.
  - name: Annual failure rate of cast gold partial crowns
    measure_type: ANNUAL_FAILURE_RATE
    value: '0.7'
    unit: '% per year'
    follow_up_years: 14.9
    population: 163 posterior cast gold partial crowns
    comparator: Ceramic inlays and onlays, 0.5% per year
    evidence:
      - reference: PMID:38702521
        reference_title: Long-term performance of ceramic in/-onlays vs. cast gold partial crowns - a retrospective clinical study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: The annual failure rates of total service times were 0.5% in teeth restored with CIO (n = 155) and 0.7% in teeth restored with CGPC (n = 163).
        explanation: Annual failure rate for the cast metal arm over the full service time, against the ceramic comparator in the same cohort.
adverse_effects:
  - name: Dental metal allergy
    effect_category: ALLERGIC_OR_HYPERSENSITIVITY
    effect_term:
      preferred_term: allergic contact dermatitis
      term:
        id: MONDO:0006525
        label: allergic contact dermatitis
    frequency: Not estimable. The pooled prevalence in symptomatic patch-tested patients had a 95% prediction interval of 3% to 91%.
    description: Reactions are rare but span most of the elements in the class. Establishing clinical relevance matters because removal of the restoration is the treatment.
    evidence:
      - reference: PMID:42106203
        reference_title: 'Prevalence of metal allergy in patients treated with intraoral prostheses and restorations: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Specific offending metals were nickel, gold, palladium, cobalt, chromium, elemental mercury, organic mercury, inorganic mercury, dental amalgam, silver, platinum, copper, zinc, tin, and indium.
        explanation: The offending elements cover every family in this class, which is what makes the effect class-level.
      - reference: PMID:42106203
        reference_title: 'Prevalence of metal allergy in patients treated with intraoral prostheses and restorations: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Metal alloys used in dentistry are biocompatible with the oral environment; nonetheless they may rarely lead to adverse reactions in susceptible individuals.
        explanation: Sets the base rate as rare.
      - reference: PMID:42106203
        reference_title: 'Prevalence of metal allergy in patients treated with intraoral prostheses and restorations: A systematic review and meta-analysis.'
        supports: PARTIAL
        evidence_source: SYSTEMATIC_REVIEW
        snippet: Assessing the true prevalence of DMA is difficult because of high heterogeneity across the studies and inconsistent clinical relevance.
        explanation: Why the frequency slot records no point estimate.
      - reference: PMID:42106203
        reference_title: 'Prevalence of metal allergy in patients treated with intraoral prostheses and restorations: A systematic review and meta-analysis.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: A high heterogeneity between studies (I²=97.1%, τ²=0.0575, Q-test P<.001), a wide 95% prediction interval (3% to 91%), and a lack of clinically relevant data made it difficult to estimate the prevalence of DMA.
        explanation: Carries the 3% to 91% prediction interval quoted in the frequency slot, and the heterogeneity that is the reason no point estimate is recorded.
      - reference: PMID:38123140
        reference_title: Contact allergies to dental materials in patients.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: Allergic contact stomatitis to dental materials is rare.
        explanation: Retrospective multicentre patch-test analysis drawn from 169,834 tested patients. The systematic review above declines to give a prevalence; this is the closest thing to an upper bound on how often the allergy becomes a clinical problem.
      - reference: PMID:38123140
        reference_title: Contact allergies to dental materials in patients.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Patch testing should not only focus on metals such as nickel, palladium, amalgam and gold, but also (meth)acrylates and the natural substances propolis and 'balsam of Peru'.
        explanation: Names the metals that carry the sensitization signal in this cohort, which agrees with the offending-metal list above.
      - reference: PMID:30738702
        reference_title: Current status of dental metal allergy in Japan.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: 'The positivity rates were as follows: nickel (22.5%); palladium (14.8%); and zinc (11.5%).'
        explanation: Patch-test positivity by element in 925 patients at one centre. Not a prevalence estimate - the meta-analysis above explains why none is recorded - but it ranks the sensitizers of the class consistently with the two sources above.
      - reference: PMID:30738702
        reference_title: Current status of dental metal allergy in Japan.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: One-half (55.6%) of the patients who underwent treatment to remove the metal experienced improvement in symptoms.
        explanation: Bounds this row's own statement that removal of the restoration is the treatment. Only about half improved, so a positive patch test does not establish that the restoration caused the symptoms.
  - name: Nickel contact allergy from nickel-containing alloys
    effect_category: ALLERGIC_OR_HYPERSENSITIVITY
    effect_term:
      preferred_term: contact dermatitis due to nickel
      term:
        id: MONDO:0005481
        label: contact dermatitis due to nickel
    description: Allergic and inflammatory risk from nickel-containing alloys, which corrode in the oral environment. Which members of the class contain nickel belongs on the children.
    evidence:
      - reference: PMID:23895079
        reference_title: Nickel alloys in the oral environment.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: However, these alloys may cause significant clinical problems, primarily allergenic and inflammatory, if the risks are ignored.
        explanation: Narrative review. States the allergic and inflammatory risk of the nickel family.
      - reference: PMID:10668036
        reference_title: 'Biocompatibility of dental casting alloys: a review.'
        supports: PARTIAL
        evidence_source: OTHER
        snippet: Several elements such as nickel and cobalt have relatively high potential to cause allergy, but the true risk of using alloys containing these elements remains undefined.
        explanation: Names nickel and cobalt as the high-potential allergens while stating that the true risk is undefined.
      - reference: PMID:23895079
        reference_title: Nickel alloys in the oral environment.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: nickel-casting alloys have low costs and favorable physical properties, but are corrosion-prone in the oral environment
        explanation: Nickel casting alloys corrode in the mouth, the source of the released nickel.
  - name: Oral lichenoid contact lesions
    effect_category: ALLERGIC_OR_HYPERSENSITIVITY
    effect_term:
      preferred_term: oral lichenoid lesion
      term:
        id: HP:0031453
        label: Oral lichenoid lesion
    description: The mucosal presentation of dental metal allergy, in the tissue contacting the restoration. Recorded at class level rather than on Amalgam because the patch-test positives in this series were led by palladium and gold rather than by amalgam constituents, and because the lesions usually improve once the responsible metal is removed.
    evidence:
      - reference: PMID:35784139
        reference_title: Oral lichenoid contact lesions related to dental metal allergy may resolve after allergen removal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Palladium and gold were the most common patch test-positive metals observed in the oral cavity of patients with OLCLs.
        explanation: Shows the reaction is not confined to one family; noble elements lead the patch-test positives here.
      - reference: PMID:35784139
        reference_title: Oral lichenoid contact lesions related to dental metal allergy may resolve after allergen removal.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: Twenty-three of 24 (95.8%) patients with OLCLs showed a complete or partial improvement after the removal of dental metal.
        explanation: Retrospective series of 30 patients, so the proportion is indicative rather than an incidence estimate. It is the reason the row carries no frequency.
  - name: Element release through corrosion
    effect_category: TOXICITY
    description: Local and systemic effects follow from elements released as the restoration corrodes. Local exposure is the higher risk because concentrations adjacent to the restoration are much higher.
    evidence:
      - reference: PMID:10668036
        reference_title: 'Biocompatibility of dental casting alloys: a review.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Systemic and local toxicity, allergy, and carcinogenicity all result from elements in the alloy being released into the mouth during corrosion.
        explanation: The mechanism that links corrosion to every biologic effect in this section.
      - reference: PMID:10668036
        reference_title: 'Biocompatibility of dental casting alloys: a review.'
        supports: PARTIAL
        evidence_source: OTHER
        snippet: Little evidence supports concerns of casting alloys causing systemic toxicity.
        explanation: Bounds the claim, since the systemic arm is not supported by evidence.
      - reference: PMID:10668036
        reference_title: 'Biocompatibility of dental casting alloys: a review.'
        supports: PARTIAL
        evidence_source: OTHER
        snippet: Despite these facts, carcinogenic effects from dental casting alloys have not been demonstrated.
        explanation: Bounds the carcinogenicity arm the same way. Certain elements are known mutagens or carcinogens, but no clinical effect from dental alloys has been shown.
      - reference: PMID:10668036
        reference_title: 'Biocompatibility of dental casting alloys: a review.'
        supports: SUPPORT
        evidence_source: OTHER
        snippet: The occurrence of local toxic effects (adjacent to the alloy) is not well documented, but is a higher risk, primarily because local tissues are exposed to much higher concentrations of released metal ions.
        explanation: Local exposure as the higher risk, bounded by the source's own note that it is not well documented.
  - name: Galvanic current between contacting dissimilar metallic restorations
    effect_category: OTHER
    description: Two dissimilar metallic restorations in contact can generate a current that the patient feels as pain. Reported as generally short-lived.
    evidence:
      - reference: PMID:8940574
        reference_title: Clinical management of galvanic current between gold and amalgam.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Galvanic currents can occur and cause pain, but this is generally shortlived and should not influence the dentist's choice of an appropriate restorative material.
        explanation: Clinical technique article. Confirms the effect occurs and bounds its clinical weight.
      - reference: PMID:25932317
        reference_title: Evaluation of effect of galvanic corrosion between nickel-chromium metal and titanium on ion release and cell toxicity.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The amount of metal ions released by galvanic corrosion due to contact between the base metal alloy and titanium was increased in all of the specimens.
        explanation: A second consequence of the same coupling, distinct from the current the patient feels - it raises ion release above what either alloy gives alone, in every specimen tested.
      - reference: PMID:25932317
        reference_title: Evaluation of effect of galvanic corrosion between nickel-chromium metal and titanium on ion release and cell toxicity.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: The release of metal ions was increased by galvanic corrosion due to contact between base metal and titanium, and it can cause adverse effects on the tissue around the implant by inducing cytotoxicity.
        explanation: Links the raised release to cytotoxicity. In vitro only, and the tissue effect is the authors' inference rather than an observed clinical outcome, so this is recorded as PARTIAL.
  - name: Metal artifacts degrading cone-beam CT image quality
    effect_category: OTHER
    description: Metallic restorations introduce severe artifacts that compromise the diagnostic accuracy of cone-beam CT, and the metal's composition is one of the factors that drive them. Class-level because it follows from the material being metallic rather than from any formulation, but graded across the families in the same way corrosion is - amalgam is the worst offender and cobalt-chromium the most variable. The per-family figures belong on the children. Recorded as OTHER because the category enum has no diagnostic-imaging value, and with no effect_term because the effect is a property of the radiograph rather than a phenotype of the patient.
    evidence:
      - reference: PMID:42203681
        reference_title: 'Artificial intelligence for reducing metal artifacts in dental CBCT images: a systematic review.'
        supports: SUPPORT
        evidence_source: SYSTEMATIC_REVIEW
        snippet: The presence of metallic restorations introduces severe artifacts that compromise the diagnostic accuracy of cone beam computed tomography (CBCT) images.
        explanation: Stated of metallic restorations as a group, which is what makes the effect class-level rather than a property of one family.
      - reference: PMID:42267249
        reference_title: What Drives Metal Artifacts in CBCT? A Comparative Study of Detector Types and Metallic Object Configurations.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Detector type, metal composition, and the number and position of metallic objects within the FOV significantly influence artifact formation in CBCT images.
        explanation: In vitro comparison across four CBCT systems. Establishes that the metal itself is one of the drivers, alongside scanner and geometry factors that are not properties of the material.
      - reference: PMID:42267249
        reference_title: What Drives Metal Artifacts in CBCT? A Comparative Study of Detector Types and Metallic Object Configurations.
        supports: PARTIAL
        evidence_source: IN_VITRO
        snippet: Amalgam produced the most severe artifacts, reflected by the lowest MGVs, while cobalt-chromium yielded the highest variability (SD) (p < 0.005).
        explanation: Shows the spread within the class. Supports the effect being class-level while locating the extremes on particular children, so no single severity is asserted here.
  - name: Palladium cross-sensitization in nickel-allergic patients
    effect_category: ALLERGIC_OR_HYPERSENSITIVITY
    effect_term:
      preferred_term: allergic contact dermatitis
      term:
        id: MONDO:0006525
        label: allergic contact dermatitis
    frequency: 34% to 65.5% of nickel-allergic patients are also allergic to palladium
    description: 'Bears on alloy substitution: moving a nickel-allergic patient to a palladium-containing alloy does not reliably avoid the problem, because the two sensitivities travel together.'
    evidence:
      - reference: PMID:12097239
        reference_title: Biocompatibility of dental casting alloys.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Interestingly, from 34% to 65.5% of the patients who are allergic to Ni are also allergic to Pd.
        explanation: The reported co-sensitization range. Narrative review.
      - reference: PMID:12097239
        reference_title: Biocompatibility of dental casting alloys.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: Further, Pd allergy always occurrs with Ni sensitivity.
        explanation: States the direction of the association. Quoted with the typographical error that is in the source abstract.
  - name: Wear debris
    effect_category: TOXICITY
    description: 'A second release route alongside dissolution: particles abraded from the restoration, rather than ions given up by corrosion.'
    evidence:
      - reference: PMID:12097239
        reference_title: Biocompatibility of dental casting alloys.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Further, microparticles are abraded from metallic restorations due to wear.
        explanation: Documents abrasion of microparticles as distinct from corrosion. Narrative review.
  - name: Periodontal and mucosal inflammation adjacent to the restoration
    effect_category: PERIODONTAL_RESPONSE
    description: Released ions and abraded particles can inflame the tissues next to the restoration, though the same review states the role of these ions in gingivitis and periodontitis is unknown. No HP or MONDO term matches "inflammation of the adjacent periodontal tissues and the oral mucosa" closely enough to bind, so none is recorded.
    evidence:
      - reference: PMID:12097239
        reference_title: Biocompatibility of dental casting alloys.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: In sufficient quantities, released metal ions-particularly Cu, Ni, Be, and abraded microparticles-can also induce inflammation of the adjacent periodontal tissues and the oral mucosa.
        explanation: Names the local inflammatory effect and the ions implicated. Narrative review.
      - reference: PMID:12097239
        reference_title: Biocompatibility of dental casting alloys.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: While there is also some in vitro evidence that the immune response can be altered by various metal ions, the role of these ions in oral inflammatory diseases such as gingivitis and periodontitis is unknown.
        explanation: Bounds the claim; the same source declines to attribute gingivitis or periodontitis to these ions.
  - name: Attribution of oral symptoms to metallic restorations
    effect_category: OTHER
    description: A caution about the rows above rather than an effect of the material. Patients relate oral symptoms to their metallic restorations more often than a material cause can be established, and the review evidence asks for a dental and general medical work-up to exclude non-material causes before any restoration is replaced. Recorded so that the safety rows in this entry are not read as licence to replace restorations on suspicion.
    evidence:
      - reference: PMID:12175579
        reference_title: Biological interactions of dental cast alloys with oral tissues.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: However, the number of cases, where such a relation can be safely diagnosed, is small.
        explanation: Literature survey. Few reported cases survive a careful causal work-up, which is the basis for the caution.
      - reference: PMID:12175579
        reference_title: Biological interactions of dental cast alloys with oral tissues.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: Patients relating oral symptoms to metal restorations should be subjected to a thorough dental and general medical examination in order to exclude non-material related diseases being the cause for their complaints/symptoms.
        explanation: Literature survey. The recommended work-up before attributing symptoms to the restoration.
