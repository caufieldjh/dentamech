    notes: Covers the predominantly base metal child of this class, including its nickel-chromium and cobalt-chromium children. EJH is the only product code under the regulation and carries submission type 510(K) Exempt.
    evidence:
      - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3710
        reference_title: 21 CFR 872.3710 Base metal alloy
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: The device is exempt from the premarket notification procedures in subpart E of part 807 of this chapter subject to the limitations in § 872.9.
        explanation: Class II with special controls, 510(k)-exempt subject to 872.9.
      - reference: url:https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpcd/classification.cfm?start_search=1&productcode=EJH
        reference_title: FDA Product Classification Database, product code EJH
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: alloy, metal, base
        explanation: Device name for EJH, class 2, regulation 872.3710, submission type 510(K) Exempt.
  - agency: FDA
