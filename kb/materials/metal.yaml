    description: Direct filling of the tooth, the intended use of the dental amalgam device type.
    procedure:
      preferred_term: direct restoration
      term:
        id: OHD:0000303
        label: direct restoration procedure
    evidence:
      - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3070
