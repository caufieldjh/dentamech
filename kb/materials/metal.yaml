  - agency: FDA
    status: EXEMPT
    regulation_number: '872.3330'
    regulation_title: Preformed crown
    device_class: CLASS_I
    product_codes:
      - ELZ
    pathways:
      - EXEMPT_510K
    special_controls: []
    identification: A preformed crown is a prefabricated device made of plastic or austenitic alloys or alloys containing 75 percent or greater gold and metals of the platinum group intended to be affixed temporarily to a tooth after removal of, or breakage of, the natural crown (that portion of the tooth that normally protrudes above the gums). It is intended for use as a functional restoration until a permanent crown is constructed. The device also may be intended for use as a functional restoration for a badly decayed deciduous (baby) tooth until the adult tooth erupts.
    approved_uses:
      - name: Functional restoration until a permanent crown is constructed
        use_context: TEMPORARY
      - name: Functional restoration for a badly decayed deciduous tooth until the adult tooth erupts
        use_context: TEMPORARY
    source_url: https://www.ecfr.gov/current/title-21/section-872.3330
    notes: The route by which the stainless steel child reaches the market, established from the device listings under ELZ rather than from the identification, which names plastic, austenitic alloys and high-gold platinum-group alloys without naming stainless steel. The austenitic clause does not establish it on its own, because 872.3350 enumerates austenitic alloys and stainless steel as distinct materials in one sentence, so FDA's own drafting does not treat the two as synonyms. The first of the two class I device types the class spans, and the only one of the five not confined to metals - the identification also covers plastic preformed crowns - so it is recorded as a device type the class spans rather than a device type of the class. ELZ is the only product code under the regulation.
    evidence:
      - reference: url:https://www.law.cornell.edu/cfr/text/21/872.3330
        reference_title: 21 CFR 872.3330 Preformed crown
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: Class I (general controls). The device is exempt from the premarket notification procedures in subpart E of part 807 of this chapter subject to the limitations in § 872.9.
        explanation: Classification paragraph. Class I and 510(k)-exempt subject to 872.9.
      - reference: url:https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpcd/classification.cfm?start_search=1&productcode=ELZ
        reference_title: FDA Product Classification Database, product code ELZ
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: crown, preformed
        explanation: Device name for ELZ, class 1, regulation 872.3330, submission type 510(K) Exempt.
      - reference: url:https://api.fda.gov/device/registrationlisting.json?search=products.product_code:ELZ+AND+proprietary_name:%22stainless+steel+crowns%22&limit=4
        reference_title: FDA Establishment Registration and Device Listing, product code ELZ
        supports: SUPPORT
        evidence_source: REGULATORY_DOCUMENT
        snippet: NuSmile Pre-Contoured Stainless Steel Crowns (SSC)
        explanation: Four establishment listings answer this query - NuSmile, two Hu-Friedy establishments and Cargus - and each carries ELZ as its only product code. Preformed stainless steel crowns are therefore listed under 872.3330, which is what makes it the stainless steel route, since the identification paragraph never names the material.
