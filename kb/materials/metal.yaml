notes: |-
  Abstract parent class. Every claim here is meant to hold for metallic restorative materials as a group; family-specific numbers belong on the children (Amalgam, Gold foil, Noble metal, High noble metal, Predominantly base metal, Stainless steel, Titanium and its subclasses).
  Regulatory. The class does not map to one regulation. Five device types in 21 CFR 872 subpart D span it (872.3060, 872.3070, 872.3330, 872.3350 and 872.3710): 872.3060 and 872.3710 are class II special controls and 510(k)-exempt subject to 872.9; 872.3330 and 872.3350 are class I and 510(k)-exempt subject to 872.9; and 872.3070 alone is class II special controls and not exempt. No regulation in subpart D names titanium as a crown and bridge material, so titanium restorations have no row here.
  Standards. Editions and FDA recognition numbers are listed in docs/regulatory.md, because the Standard class has no slot for them.
  Properties. Deliberately no numbers. Strength, hardness, elastic modulus, melting range and density vary widely across the families, so a class-level number would be an invention; per-family values belong on the children.
  Terms. Dental metal allergy is bound to MONDO:0006525 allergic contact dermatitis, a broad term, on purpose: the presentation the sources discuss is oral contact stomatitis, and no more specific oral allergy term was found in MONDO.
  Left out. Products, because brands belong on the children. Amalgam-associated oral lichenoid lesions, because that evidence is amalgam-specific and belongs on the Amalgam entry. EU MDR, Health Canada and other regulators, because none were verified against a primary source.
