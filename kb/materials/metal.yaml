        reference_title: FDA Recognized Consensus Standards, ISO 22674 Third edition 2022-08
        supports: PARTIAL
        evidence_source: STANDARD
        snippet: This document specifies requirements and test methods for metallic materials that are suitable for the fabrication of dental restorations and appliances.
        explanation: The standard covers metallic restorations generally; it does not name inlays. The inlay procedure itself is a named OHD class.
  - name: Metallic onlays
    use_context: INDIRECT_RESTORATION
    procedure:
      preferred_term: metallic onlay
      term:
        id: OHD:0000138
        label: metallic onlay restoration procedure
    evidence:
