    source_url: https://www.ecfr.gov/current/title-21/section-872.3350
    notes: The only device type in subpart D whose identification names both gold and stainless steel, the two prefabricated metal members of this class, and the second of the two class I device types the class spans. Unlike 872.3330 it is confined to metals. Its indication is prosthodontic rather than restorative - occlusal harmony against a removable denture - and it is a permanent cusp, where the preformed crown is explicitly temporary. ELO is the only product code under the regulation.
    evidence:
