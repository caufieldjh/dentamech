        id: UBERON:0003686
        label: tooth socket
    description: Proposed, not yet tested in people in the source study, as an autologous filling for the socket left by an extraction, to limit the bone loss that follows.
    evidence:
      - reference: DOI:10.1007/s12663-024-02311-4
        reference_title: 'Evaluation of the Osteogenic Potential of Periodontal Ligament and Tooth-Derived Substrates Effect on Osteogenesis: An In Vitro Pilot Study'
