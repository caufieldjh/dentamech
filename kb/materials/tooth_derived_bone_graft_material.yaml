        explanation: "Discussion, background citing other work. OTHER: background, not the study's own results."
  - name: Cementum
    role: OTHER
    description: Root cementum stays on the particles even when the periodontal ligament is removed with curettes, so every preparation in the source study contained it. OTHER, because ComponentRoleEnum has no role for a tissue.
    evidence:
      - reference: DOI:10.1007/s12663-024-02311-4
        reference_title: 'Evaluation of the Osteogenic Potential of Periodontal Ligament and Tooth-Derived Substrates Effect on Osteogenesis: An In Vitro Pilot Study'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: in all the preparations reported herein, the cementum was presented, even in the group where the periodontal ligament was removed
        explanation: 'Discussion: cementum in every preparation, because curettes cannot be relied on to remove it.'
properties:
  - name: Osteogenic potential in vitro
    property_type: OTHER
    test_method: Protein extracted from the ground teeth was added at 10 and 100 ng/µL to cultures of a mouse pre-osteoblastic cell line (MC3T3-E1); proliferation, viability, expression of COL-I, RUNX-2 and BMP-2, and mineral nodules were measured against untreated cells.
    description: Extracts of teeth with the enamel and periodontal ligament removed increased the expression of the osteogenic genes studied and formed more phosphate nodules. The periodontal ligament lowered cell proliferation and viability. At 100 ng/µL, the higher of the two concentrations, extracts of every preparation gave more mineral than the control. These are cell-culture results with extracts; the graft particles themselves were not tested. OTHER, because PropertyTypeEnum has no value for osteogenic potential.
    evidence:
      - reference: DOI:10.1007/s12663-024-02311-4
        reference_title: 'Evaluation of the Osteogenic Potential of Periodontal Ligament and Tooth-Derived Substrates Effect on Osteogenesis: An In Vitro Pilot Study'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Pre-osteoblastic cells were incubated with protein extracted from this substrate to verify their osteoinductive potential.
        explanation: 'Abstract, methods: what was tested.'
      - reference: DOI:10.1007/s12663-024-02311-4
        reference_title: 'Evaluation of the Osteogenic Potential of Periodontal Ligament and Tooth-Derived Substrates Effect on Osteogenesis: An In Vitro Pilot Study'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The mouse's pre-osteoblastic cell line (MC3T3-E1) used in this study
        explanation: 'Methods, cell cultures: the cells were a mouse line.'
      - reference: DOI:10.1007/s12663-024-02311-4
        reference_title: 'Evaluation of the Osteogenic Potential of Periodontal Ligament and Tooth-Derived Substrates Effect on Osteogenesis: An In Vitro Pilot Study'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: there was an increased gene expression of all genes studied in the WEPL group and a greater formation of phosphate nodules
        explanation: 'Abstract, results: WEPL is the preparation without enamel and periodontal ligament.'
      - reference: DOI:10.1007/s12663-024-02311-4
