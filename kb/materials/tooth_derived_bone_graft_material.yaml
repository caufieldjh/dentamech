id: dentamech:48000254-9fdc-43f9-942f-f218340669dd
name: Tooth-derived bone graft material
description: Extracted human teeth ground into particles and proposed as a graft material for the extraction socket, in place of autologous bone, so that a tooth otherwise discarded is reused. Dentin is the tissue it is valued for, being similar to bone in its organic and inorganic structure. The evidence so far recorded here is one in vitro pilot study, which tested protein extracts of the ground teeth on cultured cells, not the graft itself.
description_evidence:
  - reference: DOI:10.1007/s12663-024-02311-4
    reference_title: 'Evaluation of the Osteogenic Potential of Periodontal Ligament and Tooth-Derived Substrates Effect on Osteogenesis: An In Vitro Pilot Study'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Extracted teeth are usually discarded, though they could be useful as autologous graft material for the extraction socket.
    explanation: "Discussion: the authors' proposed use. OTHER: the authors' reasoning, not a result of the study."
