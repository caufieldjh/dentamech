discussions:
  - discussion_id: ohd-term-tooth-derived-bone-graft-material
    kind: CURATION_TODO
    status: OPEN
    prompt: 'OHD has no term for a tooth-derived bone graft material, nor for bone grafting material at all (l~graft, l~dentin, l~bone substitute and l~socket find no material in the release, and no label in dental_material.owl or ohd-edit.owl on OHD main contains graft, searched 2026-11-23). Propose one at this grain, a graft material made from extracted human teeth, with a parent for dental bone grafting materials (FDA regulates bone grafting material under 21 CFR 872.3930). Where a bone graft belongs in OHD, outside dental restoration material, is for OHD to decide.'
  - discussion_id: purpose-tooth-derived-bone-graft-material
    kind: OPEN_QUESTION
    status: OPEN
    prompt: 'purpose is unset. A bone graft restores bone, not tooth structure, so RESTORATIVE does not fit as defined; it becomes part of the patient, so AUXILIARY does not fit; and it is not PREVENTIVE, though it is placed to prevent bone loss after an extraction. Does MaterialPurposeEnum need a value for grafting or regenerative materials? For the project''s dental materials expert, as in #50.'
  - discussion_id: evidence-tooth-derived-bone-graft-material
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: 'The only source is one in vitro pilot study of protein extracts on a mouse cell line. No clinical performance, adverse effects, preparation protocol beyond hand grinding, or regulatory status is recorded. Whether FDA treats a tooth-derived graft as bone grafting material under 21 CFR 872.3930, or regulates only the devices that prepare it, has not been established; product code NUN, bone grafting material, human source, under that regulation (docs/regulatory.md) is a lead. Clinical studies of autologous tooth grafts in socket preservation, and the regulation, would fill this.'
    rationale: A record resting on cell-culture results with extracts says little about the graft as used in a patient.
notes: 'Built from one open-access in vitro pilot study (DOI:10.1007/s12663-024-02311-4), quoted from its full text. Its teeth and counts are inconsistent where not quoted: the abstract says twelve maxillary third molars, but the results list upper and lower molars; the methods take one third molar from each of six patients but twelve teeth in all, and the results say two per patient; the methods name four test groups of three teeth and a control with no tooth material, but the results list teeth in Group 1 (control). The best preparation is written both WEPL and WELP. The extract concentrations are given as ng/nL in the methods and ng/µL elsewhere; ng/µL, the unit of the results, is used here. The extracts tested contained pulp, which the study did not test separately. experimental is unset: the paper does not describe a laboratory formulation, and tooth grafts are prepared from the patient''s own tooth rather than manufactured. No parent record: no record yet covers bone grafting materials.'
