        evidence_source: OTHER
        snippet: Extracted teeth are usually discarded, though they could be useful as autologous graft material for the extraction socket.
        explanation: "Discussion: the proposed use. OTHER: the authors' reasoning; the study did not test it in people."
      - reference: DOI:10.1007/s12663-024-02311-4
        reference_title: 'Evaluation of the Osteogenic Potential of Periodontal Ligament and Tooth-Derived Substrates Effect on Osteogenesis: An In Vitro Pilot Study'
