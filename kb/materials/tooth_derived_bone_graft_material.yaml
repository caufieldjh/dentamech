composition:
  - name: Dentin
    role: OTHER
    description: The tissue the graft is valued for. Its collagen forms a crosslinked scaffold in which mineral is deposited, and its organic and inorganic structure resembles bone's. OTHER, because ComponentRoleEnum has no role for a tissue.
    evidence:
